version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    # Only patch bumps and security advisories — major / minor cascades
    # cause flood-of-PRs noise on an early-stage repo. Manual bumps still
    # happen via PR when we actually want them.
    allow:
      - dependency-type: "all"
        update-types: ["version-update:semver-patch"]
    groups:
      patch-updates:
        update-types: ["patch"]
    # The fluent-rs stack is locked together. fluent-bundle 0.16 pins
    # fluent-langneg ^0.13 and unic-langid ^0.9. Remove this ignore when
    # fluent-bundle ships a fluent-langneg 0.14 (icu-locid) compatible
    # release.
    ignore:
      - dependency-name: "fluent-langneg"
        versions: [">=0.14"]
      - dependency-name: "fluent-bundle"
        versions: [">=0.17"]
      - dependency-name: "unic-langid"
        versions: [">=0.10"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    labels: ["dependencies", "ci"]
    # Deliberately unfiltered, unlike the cargo ecosystem above. Every action
    # is pinned to a commit SHA, so there is no floating tag absorbing upstream
    # fixes: a pin that Dependabot may not advance is a pin that rots, and the
    # security patch it is holding back never arrives. Restricting this to
    # `semver-patch` would also silently drop minor releases, which is where
    # these actions ship most of their runtime and Node-version changes.
    # Dependabot rewrites both the SHA and the trailing `# vX.Y.Z` comment.
