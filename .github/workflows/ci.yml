name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository, so the token every third-party action
# inherits cannot be spent on one. Declaring this explicitly also pins the
# grant against a change to the repository-wide default workflow permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0
  CARGO_LLVM_COV_VERSION: "0.9.0"
  CI_CACHE_NAMESPACE: ci-v3

jobs:
  macos-core:
    name: macOS core gates
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The previous-release check resolves the last release tag, so it needs every tag and commit.
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-macos-14
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Includes the cold test-binary build; the baseline-only observation envelope is 640 seconds.
      - name: Measure PTY close baseline
        run: cargo test -p sonicterm-app --lib pty_close_baseline -- --ignored --nocapture

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # perf-counters only marks that the App has the counter API, and perf-hook-checkpoint-memory and
      # perf-hook-trim that it has the checkpoint memory and covered-window trim hooks; the perf_scenarios
      # example is their sole reader, so each host lints that example with them.
      - name: Lint perf scenarios with frame counters
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim -- -D warnings

      # perf-frame-texture marks only that the renderer reports its frame texture's extent, read by the
      # same example, so each host lints it with that feature too.
      - name: Lint perf scenarios with the frame texture reading
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-frame-texture -- -D warnings

      # perf-echo-trace marks only that the App has the S2 echo watch (it implies perf-counters); the same
      # example is its sole caller, so each host lints it with that feature too.
      - name: Lint perf scenarios with the echo trace
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-echo-trace -- -D warnings
      # Every harness API cfg's code compiles only with its cfg, which perf-compare sets when both refs
      # have the entry's methods; each host lints all of them at once, with the counters they need.
      - name: Lint perf scenarios with the harness API cfgs
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --all-targets --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim -- -D warnings --cfg perf_atlas_retry_api --cfg perf_s10_attribution_api --cfg perf_completeness_api --cfg perf_dispatch_timeline_api

      - name: Validate workspace manifests
        shell: bash
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Check declared rust-version against the lock
        shell: bash
        run: bash scripts/check-rust-version.sh

      - name: Check process exit paths
        shell: bash
        run: bash scripts/check-no-raw-process-exit.sh

      - name: Check window owner registration
        shell: bash
        run: bash scripts/check-window-owner-registration.sh

      - name: Check workflow supply chain
        shell: bash
        run: bash scripts/check-workflow-supply-chain.sh

      - name: Check authored Rust comments
        shell: bash
        run: bash scripts/check-authored-rust-comments.sh

      - name: Check script identifiers
        shell: bash
        run: bash scripts/check-script-identifiers.sh

      - name: Check public Rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      # The head harness overlaid on the previous release tag must still compile; a comparison builds it there.
      - name: Check the perf harness against the previous release
        shell: bash
        run: python3 scripts/perf-compare.py --check-previous-release

      - name: Run workspace unit and integration tests
        shell: bash
        run: bash scripts/check-workspace-crates.sh

      - name: Run workspace documentation tests
        run: cargo test --workspace --doc --no-fail-fast

      - name: Run scenario harness unit tests
        run: cargo test --locked -p sonicterm-app --example perf_scenarios

      - name: Run scenario harness unit tests with frame counters
        run: cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim

      - name: Measure the glyph atlas working set
        run: cargo test --locked -p sonicterm-app --example perf_scenarios glyph_atlas_working_set -- --ignored --nocapture

      - name: Run scenario harness unit tests with the frame texture reading
        run: cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-frame-texture

      - name: Run scenario harness unit tests with the echo trace
        run: cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-echo-trace

      - name: Run scenario harness unit tests with the harness API cfgs
        shell: bash
        run: RUSTFLAGS="--check-cfg cfg(perf_atlas_retry_api) --check-cfg cfg(perf_s10_attribution_api) --check-cfg cfg(perf_completeness_api) --check-cfg cfg(perf_dispatch_timeline_api) --cfg perf_atlas_retry_api --cfg perf_s10_attribution_api --cfg perf_completeness_api --cfg perf_dispatch_timeline_api" cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim

      - name: Report host window capability
        run: cargo test -p sonicterm-gpu --test ci_host_capability_probe -- --nocapture

      - name: Report host adapter classification
        run: cargo test -p sonicterm-gpu --test ci_adapter_classification_probe -- --nocapture

      - name: Report renderer churn baseline
        run: cargo test -p sonicterm-gpu --test renderer_churn_baseline -- --nocapture

      - name: Run release-note unit test
        shell: bash
        run: bash scripts/test-release-notes.sh

      - name: Test wiki publisher
        shell: bash
        run: bash scripts/test-wiki-publish.sh

      - name: Verify frozen PTY feasibility evidence
        shell: bash
        run: bash scripts/pty-backend-feasibility.sh --check

      - name: Verify resource inventory
        shell: bash
        run: bash scripts/test-resource-inventory.sh

      - name: Run deterministic soak control gate
        shell: bash
        run: bash scripts/test-soak-harness.sh

      - name: Test resource baseline evidence collector
        shell: bash
        run: bash scripts/test-resource-baseline-evidence.sh

      - name: Capture real resource baseline evidence
        id: capture_resource_baseline
        shell: bash
        run: |
          python3 scripts/resource-baseline-evidence.py \
            --runner-label macos-14 \
            --output-dir target/v1.2.0-baseline/evidence-macos-14

      - name: Upload resource baseline evidence
        if: ${{ !cancelled() && steps.capture_resource_baseline.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-baseline-evidence-macos-14
          path: target/v1.2.0-baseline/evidence-macos-14
          if-no-files-found: error

  macos-coverage:
    name: macOS logic coverage
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-macos-14
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: false

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "${{ env.CARGO_LLVM_COV_VERSION }}" --locked

      # The pull-request head reaches provenance through env; the runner supplies other run metadata.
      - name: Run Rust logic coverage gate
        id: coverage
        shell: bash
        env:
          COVERAGE_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/rust-logic-coverage.sh

      # One artifact per run attempt whose coverage step started, after success
      # and after failure: the provenance record, plus measurement/ with the
      # report and inventory once they are published. A failure before the
      # coverage step leaves no artifact; its job log is the only diagnostic.
      - name: Upload coverage evidence
        if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-logic-coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/rust-logic-coverage-evidence
          retention-days: 90
          if-no-files-found: error

  macos-smoke:
    name: macOS native runtime smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs must report: Intel and Apple Silicon resolve different Cairo
      # and font binaries, so one architecture's result cannot stand in for the
      # other's, and a cancelled sibling would hide which one regressed.
      fail-fast: false
      matrix:
        include:
          # `minimum` is the declared deployment floor for this architecture,
          # asserted as a ceiling rather than read back from the build. A newer
          # SDK or a Homebrew bottle raising LC_BUILD_VERSION must fail the gate
          # and be decided deliberately, never raise the shipped floor silently.
          - runner: macos-14
            arch: aarch64
            minimum: "14.0"
          - runner: macos-15-intel
            arch: x86_64
            minimum: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keyed by runner: an x86_64 leg restoring the aarch64 target
          # directory would rebuild anyway, and would poison the shared entry.
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-${{ matrix.runner }}
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.runner == 'macos-15-intel' }}

      - name: Install native dependencies
        run: brew install cairo pkg-config

      - name: Build macOS native selection fixture
        run: cargo build --locked -p sonicterm-app --example native_split_selection

      - name: Require macOS native split selection
        run: python3 scripts/native-selection-smoke.py

      - name: Require macOS perf scenario smoke
        run: python3 scripts/perf-compare.py --smoke

      - name: Build macOS release binary for runtime smoke
        run: cargo build --release -p sonicterm-mac

      - name: Require macOS native runtime smoke
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-smoke-${{ matrix.arch }}" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-smoke-${{ matrix.arch }}.log" \
            -- target/release/sonicterm-mac --runtime-smoke

      - name: Require macOS GPU frame-validation smoke
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 --scenario frame-validation \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-frame-validation-smoke-${{ matrix.arch }}" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-frame-validation-smoke-${{ matrix.arch }}.log" \
            -- target/release/sonicterm-mac --runtime-smoke

      - name: Require macOS GPU device-recovery smoke
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 --scenario device-recovery \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-device-recovery-smoke-${{ matrix.arch }}" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-device-recovery-smoke-${{ matrix.arch }}.log" \
            -- target/release/sonicterm-mac --runtime-smoke

      # The step above proves the build tree runs where Homebrew's Cairo sits on
      # the loader path. The two below prove the relocated, self-contained
      # bundle does, which is the only artifact a user ever opens. create-dmg is
      # deliberately not installed: the packager falls back to hdiutil, and the
      # icon is a tracked asset, so no ImageMagick bake is needed here.
      - name: Package macOS dmg for validation
        env:
          SONICTERM_MAX_MACOS_MINIMUM: ${{ matrix.minimum }}
        run: bash scripts/make-macos-dmg.sh target/release/sonicterm-mac ci mac-${{ matrix.arch }}

      - name: Validate packaged macOS dmg
        run: |
          python3 scripts/test-macos-package.py \
            --dmg "dist/SonicTerm-ci-mac-${{ matrix.arch }}.dmg" \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-package-${{ matrix.arch }}" \
            --max-minimum-macos "${{ matrix.minimum }}"

      - name: Upload macOS package evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Evidence and logs only. The validated .dmg is a CI-local build, not
          # a release asset, and publishing it would invite use as one.
          name: sonicterm-macos-package-evidence-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/sonicterm-macos-package-${{ matrix.arch }}/package-evidence.json
          if-no-files-found: ignore

      - name: Upload macOS native selection evidence
        if: ${{ failure() && env.SONICTERM_SELECTION_LOG_DIR != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-macos-selection-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ env.SONICTERM_SELECTION_LOG_DIR }}
          if-no-files-found: error

      - name: Upload macOS perf scenario smoke evidence
        if: ${{ failure() && env.SONICTERM_PERF_EVIDENCE_DIR != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-macos-perf-smoke-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ env.SONICTERM_PERF_EVIDENCE_DIR }}
          if-no-files-found: error

      - name: Upload macOS native smoke logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-macos-smoke-logs-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sonicterm-macos-smoke-${{ matrix.arch }}.log
            ${{ runner.temp }}/sonicterm-macos-frame-validation-smoke-${{ matrix.arch }}.log
            ${{ runner.temp }}/sonicterm-macos-device-recovery-smoke-${{ matrix.arch }}.log
            ${{ runner.temp }}/sonicterm-macos-smoke-${{ matrix.arch }}/logs/**
            ${{ runner.temp }}/sonicterm-macos-frame-validation-smoke-${{ matrix.arch }}/logs/**
            ${{ runner.temp }}/sonicterm-macos-device-recovery-smoke-${{ matrix.arch }}/logs/**
            ${{ runner.temp }}/sonicterm-macos-package-${{ matrix.arch }}/**
            dist/*.dmg.creation-*/*.log
            dist/*.dmg.creation-*/result.json
          if-no-files-found: ignore

  macos:
    name: macos-14 / unit tests
    runs-on: ubuntu-latest
    needs: [macos-core, macos-coverage, macos-smoke]
    if: always()
    steps:
      - name: Verify macOS shards
        shell: bash
        env:
          CORE: ${{ needs.macos-core.result }}
          COVERAGE: ${{ needs.macos-coverage.result }}
          SMOKE: ${{ needs.macos-smoke.result }}
        run: |
          for result in "$CORE" "$COVERAGE" "$SMOKE"; do
            test "$result" = "success"
          done

  windows-native:
    name: Windows native dependency cache
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve vcpkg commit
        id: vcpkg
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Save vcpkg binaries (Cairo)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  windows-checks:
    name: Windows static and documentation gates
    runs-on: windows-latest
    needs: [windows-native]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The previous-release check resolves the last release tag, so it needs every tag and commit.
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Resolve vcpkg commit
        id: vcpkg
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-windows-latest
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # perf-counters only marks that the App has the counter API, and perf-hook-checkpoint-memory and
      # perf-hook-trim that it has the checkpoint memory and covered-window trim hooks; the perf_scenarios
      # example is their sole reader, so each host lints that example with them.
      - name: Lint perf scenarios with frame counters
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim -- -D warnings

      # perf-frame-texture marks only that the renderer reports its frame texture's extent, read by the
      # same example, so each host lints it with that feature too.
      - name: Lint perf scenarios with the frame texture reading
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-frame-texture -- -D warnings

      # perf-echo-trace marks only that the App has the S2 echo watch (it implies perf-counters); the same
      # example is its sole caller, so each host lints it with that feature too.
      - name: Lint perf scenarios with the echo trace
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-echo-trace -- -D warnings
      # Every harness API cfg's code compiles only with its cfg, which perf-compare sets when both refs
      # have the entry's methods; each host lints all of them at once, with the counters they need.
      - name: Lint perf scenarios with the harness API cfgs
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --all-targets --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim -- -D warnings --cfg perf_atlas_retry_api --cfg perf_s10_attribution_api --cfg perf_completeness_api --cfg perf_dispatch_timeline_api

      - name: Validate workspace manifests
        shell: bash
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Check declared rust-version against the lock
        shell: bash
        run: bash scripts/check-rust-version.sh

      - name: Check process exit paths
        shell: bash
        run: bash scripts/check-no-raw-process-exit.sh

      - name: Check window owner registration
        shell: bash
        run: bash scripts/check-window-owner-registration.sh

      - name: Check workflow supply chain
        shell: bash
        run: bash scripts/check-workflow-supply-chain.sh

      - name: Check authored Rust comments
        shell: bash
        run: bash scripts/check-authored-rust-comments.sh

      - name: Check script identifiers
        shell: bash
        run: bash scripts/check-script-identifiers.sh

      - name: Check public Rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      # The head harness overlaid on the previous release tag must still compile; a comparison builds it there.
      - name: Check the perf harness against the previous release
        shell: bash
        run: python scripts/perf-compare.py --check-previous-release

  windows-tests-workspace:
    name: Windows workspace tests
    runs-on: windows-latest
    # The early app-only test build can be rebuilt when workspace dev features are unified later.
    needs: [windows-native]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Resolve vcpkg commit
        id: vcpkg
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
