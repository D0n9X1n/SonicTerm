  windows:
    name: windows-latest / unit tests
    runs-on: ubuntu-latest
    needs: [windows-native, windows-checks, windows-tests-workspace, windows-tests-harness, windows-tests-harness-features, windows-tests-harness-api, windows-tests-runtime, windows-smoke]
    if: always()
    steps:
      - name: Verify Windows shards
        shell: bash
        env:
          NATIVE: ${{ needs.windows-native.result }}
          CHECKS: ${{ needs.windows-checks.result }}
          TESTS_WORKSPACE: ${{ needs.windows-tests-workspace.result }}
          TESTS_HARNESS: ${{ needs.windows-tests-harness.result }}
          TESTS_HARNESS_FEATURES: ${{ needs.windows-tests-harness-features.result }}
          TESTS_HARNESS_API: ${{ needs.windows-tests-harness-api.result }}
          TESTS_RUNTIME: ${{ needs.windows-tests-runtime.result }}
          SMOKE: ${{ needs.windows-smoke.result }}
        run: |
          for result in "$NATIVE" "$CHECKS" "$TESTS_WORKSPACE" "$TESTS_HARNESS" "$TESTS_HARNESS_FEATURES" "$TESTS_HARNESS_API" "$TESTS_RUNTIME" "$SMOKE"; do
            test "$result" = "success"
          done

  linux-core:
    name: Ubuntu core gates
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install runner and native dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config python3 \
            libcairo2-dev libfontconfig1-dev libwayland-dev libx11-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 \
            mesa-vulkan-drivers libvulkan1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-linux-ubuntu-22.04
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Includes the cold test-binary build; the baseline-only observation envelope is 640 seconds.
      - name: Measure PTY close baseline
        run: cargo test -p sonicterm-app --lib pty_close_baseline -- --ignored --nocapture

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # perf-counters only marks that the App has the counter API, and perf-hook-checkpoint-memory and
      # perf-hook-trim that it has the checkpoint memory and covered-window trim hooks; the perf_scenarios
      # example is their sole reader, so each host lints that example with them.
      - name: Lint perf scenarios with frame counters
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim -- -D warnings

      # perf-frame-texture marks only that the renderer reports its frame texture's extent, read by the
      # same example, so each host lints it with that feature too.
      - name: Lint perf scenarios with the frame texture reading
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-frame-texture -- -D warnings

      # perf-echo-trace marks only that the App has the S2 echo watch (it implies perf-counters); the same
      # example is its sole caller, so each host lints it with that feature too.
      - name: Lint perf scenarios with the echo trace
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --features perf-echo-trace -- -D warnings
      # Every harness API cfg's code compiles only with its cfg, which perf-compare sets when both refs
      # have the entry's methods; each host lints all of them at once, with the counters they need.
      - name: Lint perf scenarios with the harness API cfgs
        run: cargo clippy --locked -p sonicterm-app --example perf_scenarios --all-targets --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim -- -D warnings --cfg perf_atlas_retry_api --cfg perf_s10_attribution_api --cfg perf_completeness_api --cfg perf_dispatch_timeline_api

      - name: Check public Rustdoc
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc -p sonicterm-resource --all-features --no-deps

      - name: Run workspace unit and integration tests
        run: bash scripts/check-workspace-crates.sh

      - name: Run workspace documentation tests
        run: cargo test --workspace --doc --no-fail-fast

      - name: Run scenario harness unit tests
        run: cargo test --locked -p sonicterm-app --example perf_scenarios

      - name: Run scenario harness unit tests with frame counters
        run: cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim

      - name: Run scenario harness unit tests with the frame texture reading
        run: cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-frame-texture

      - name: Run scenario harness unit tests with the echo trace
        run: cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-echo-trace

      - name: Run scenario harness unit tests with the harness API cfgs
        shell: bash
        run: RUSTFLAGS="--check-cfg cfg(perf_atlas_retry_api) --check-cfg cfg(perf_s10_attribution_api) --check-cfg cfg(perf_completeness_api) --check-cfg cfg(perf_dispatch_timeline_api) --cfg perf_atlas_retry_api --cfg perf_s10_attribution_api --cfg perf_completeness_api --cfg perf_dispatch_timeline_api" cargo test --locked -p sonicterm-app --example perf_scenarios --features perf-counters,perf-hook-checkpoint-memory,perf-hook-trim

      - name: Run source and release tooling gates
        run: |
          bash scripts/check-authored-rust-comments.sh
          bash scripts/check-script-identifiers.sh
          bash scripts/check-no-raw-process-exit.sh
          bash scripts/check-rust-version.sh
          bash scripts/check-window-owner-registration.sh
          bash scripts/check-workflow-supply-chain.sh
          bash scripts/test-linux-packages.sh
          bash scripts/test-release-assets.sh
          bash scripts/test-release-notes.sh
          bash scripts/test-wiki-publish.sh

  linux-packages:
    name: Ubuntu package and runtime gates
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install runner, package, and runtime dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential zstd pkg-config python3 \
            libcairo2-dev libfontconfig1-dev libwayland-dev libx11-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 binutils dpkg-dev \
            file desktop-file-utils appstream lintian mesa-vulkan-drivers \
            libvulkan1 xvfb x11-utils weston

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-linux-ubuntu-22.04
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: false

      - name: Build Linux release binary
        run: cargo build --release -p sonicterm-linux

      - name: Build and validate Linux packages
        id: packages
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          members = set(metadata["workspace_members"])
          versions = {package["version"] for package in metadata["packages"] if package["id"] in members}
          if len(versions) != 1:
              raise SystemExit(f"workspace versions differ: {sorted(versions)}")
          print(versions.pop())
          ')"
          tag="v${version}"
          python3 scripts/prepare-release-assets.py check-version --tag "$tag"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            bash scripts/make-linux-packages.sh target/release/sonicterm "$tag" dist
          tarball="dist/SonicTerm-${tag}-linux-x86_64.tar.gz"
          deb="dist/SonicTerm-${tag}-linux-x86_64.deb"
          bash scripts/test-linux-packages.sh "$tarball" "$deb"
          desktop-file-validate \
            "dist/.linux-package-work/SonicTerm-${tag}-linux-x86_64/share/applications/com.d0n9x1n.SonicTerm.desktop"
          appstreamcli validate --no-net \
            "dist/.linux-package-work/SonicTerm-${tag}-linux-x86_64/share/metainfo/com.d0n9x1n.SonicTerm.metainfo.xml"
          if ! lintian "$deb"; then
            echo "::warning::lintian reported advisory Linux package findings"
          fi
          {
            echo "tag=$tag"
            echo "tarball=$tarball"
            echo "deb=$deb"
          } >> "$GITHUB_OUTPUT"

      - name: Run packaged X11 and Wayland smokes
        run: bash scripts/smoke-linux-packages.sh "${{ steps.packages.outputs.tarball }}" "${{ steps.packages.outputs.deb }}"

      - name: Run packaged GPU frame-validation smokes
        run: bash scripts/smoke-linux-packages.sh "${{ steps.packages.outputs.tarball }}" "${{ steps.packages.outputs.deb }}" frame-validation

      - name: Run packaged GPU device-recovery smokes
        run: bash scripts/smoke-linux-packages.sh "${{ steps.packages.outputs.tarball }}" "${{ steps.packages.outputs.deb }}" device-recovery

      - name: Upload Linux package smoke logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-linux-smoke-logs-${{ github.sha }}
          path: sonicterm-*-smoke.log
          if-no-files-found: ignore

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-linux-packages-${{ github.sha }}
          path: |
            ${{ steps.packages.outputs.tarball }}
            ${{ steps.packages.outputs.deb }}
          if-no-files-found: error

  linux:
    name: ubuntu 22.04 / workspace, packages, X11, Wayland
    runs-on: ubuntu-latest
    needs: [linux-core, linux-packages]
    if: always()
    steps:
      - name: Verify Ubuntu shards
        shell: bash
        env:
          CORE: ${{ needs.linux-core.result }}
          PACKAGES: ${{ needs.linux-packages.result }}
        run: |
          for result in "$CORE" "$PACKAGES"; do
            test "$result" = "success"
          done
