name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository, so the token every third-party action
# inherits cannot be spent on one. Declaring this explicitly also pins the
# grant against a change to the repository-wide default workflow permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0
  CARGO_LLVM_COV_VERSION: "0.9.0"
  CI_CACHE_NAMESPACE: ci-v3

jobs:
  macos-core:
    name: macOS core gates
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-macos-14
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all --check

      - name: Clippy
        timeout-minutes: 15
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate workspace manifests
        timeout-minutes: 2
        shell: bash
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Check declared rust-version against the lock
        timeout-minutes: 5
        shell: bash
        run: bash scripts/check-rust-version.sh

      - name: Check process exit paths
        timeout-minutes: 2
        shell: bash
        run: bash scripts/check-no-raw-process-exit.sh

      - name: Check window owner registration
        timeout-minutes: 2
        shell: bash
        run: bash scripts/check-window-owner-registration.sh

      - name: Check workflow supply chain
        timeout-minutes: 2
        shell: bash
        run: bash scripts/check-workflow-supply-chain.sh

      - name: Check authored Rust comments
        timeout-minutes: 5
        shell: bash
        run: bash scripts/check-authored-rust-comments.sh

      - name: Check public Rustdoc
        timeout-minutes: 10
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Run workspace unit and integration tests
        timeout-minutes: 35
        shell: bash
        run: bash scripts/check-workspace-crates.sh

      - name: Run workspace documentation tests
        timeout-minutes: 15
        run: cargo test --workspace --doc --no-fail-fast

      - name: Report host window capability
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test ci_host_capability_probe -- --nocapture

      - name: Report host adapter classification
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test ci_adapter_classification_probe -- --nocapture

      - name: Report renderer churn baseline
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test renderer_churn_baseline -- --nocapture

      - name: Run release-note unit test
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-release-notes.sh

      - name: Test wiki publisher
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-wiki-publish.sh

      - name: Verify frozen PTY feasibility evidence
        timeout-minutes: 5
        shell: bash
        run: bash scripts/pty-backend-feasibility.sh --check

      - name: Verify resource inventory
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-resource-inventory.sh

      - name: Run deterministic soak control gate
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-soak-harness.sh

      - name: Test resource baseline evidence collector
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-resource-baseline-evidence.sh

      - name: Capture real resource baseline evidence
        id: capture_resource_baseline
        timeout-minutes: 10
        shell: bash
        run: |
          python3 scripts/resource-baseline-evidence.py \
            --runner-label macos-14 \
            --output-dir target/v1.2.0-baseline/evidence-macos-14

      - name: Upload resource baseline evidence
        if: ${{ !cancelled() && steps.capture_resource_baseline.conclusion != 'skipped' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-baseline-evidence-macos-14
          path: target/v1.2.0-baseline/evidence-macos-14
          if-no-files-found: error

  macos-coverage:
    name: macOS logic coverage
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-macos-14
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: false

      - name: Install cargo-llvm-cov
        timeout-minutes: 10
        run: cargo install cargo-llvm-cov --version "${{ env.CARGO_LLVM_COV_VERSION }}" --locked

      # The coverage step's own deadline ends before the job's: its 20 minutes
      # plus the upload's 5 leave 10 of the job's 35 for setup, which took under
      # 2 minutes in recent runs, so the upload still runs after the gate fails
      # or reaches its deadline. The pull-request head reaches the provenance
      # record through env; the runner provides the other run metadata.
      - name: Run Rust logic coverage gate
        id: coverage
        timeout-minutes: 20
        shell: bash
        env:
          COVERAGE_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/rust-logic-coverage.sh

      # One artifact per run attempt whose coverage step started, after success
      # and after failure: the provenance record, plus measurement/ with the
      # report and inventory once they are published. A failure before the
      # coverage step leaves no artifact; its job log is the only diagnostic.
      - name: Upload coverage evidence
        if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-logic-coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/rust-logic-coverage-evidence
          retention-days: 90
          if-no-files-found: error

  macos-smoke:
    name: macOS native runtime smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      # Both legs must report: Intel and Apple Silicon resolve different Cairo
      # and font binaries, so one architecture's result cannot stand in for the
      # other's, and a cancelled sibling would hide which one regressed.
      fail-fast: false
      matrix:
        include:
          # `minimum` is the declared deployment floor for this architecture,
          # asserted as a ceiling rather than read back from the build. A newer
          # SDK or a Homebrew bottle raising LC_BUILD_VERSION must fail the gate
          # and be decided deliberately, never raise the shipped floor silently.
          - runner: macos-14
            arch: aarch64
            minimum: "14.0"
          - runner: macos-15-intel
            arch: x86_64
            minimum: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keyed by runner: an x86_64 leg restoring the aarch64 target
          # directory would rebuild anyway, and would poison the shared entry.
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-${{ matrix.runner }}
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: false

      - name: Install native dependencies
        timeout-minutes: 10
        run: brew install cairo pkg-config

      - name: Build macOS release binary for runtime smoke
        timeout-minutes: 25
        run: cargo build --release -p sonicterm-mac

      - name: Require macOS native runtime smoke
        timeout-minutes: 3
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-smoke-${{ matrix.arch }}" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-smoke-${{ matrix.arch }}.log" \
            -- target/release/sonicterm-mac --runtime-smoke

      # The step above proves the build tree runs where Homebrew's Cairo sits on
      # the loader path. The two below prove the relocated, self-contained
      # bundle does, which is the only artifact a user ever opens. create-dmg is
      # deliberately not installed: the packager falls back to hdiutil, and the
      # icon is a tracked asset, so no ImageMagick bake is needed here.
      - name: Package macOS dmg for validation
        timeout-minutes: 10
        env:
          SONICTERM_MAX_MACOS_MINIMUM: ${{ matrix.minimum }}
        run: bash scripts/make-macos-dmg.sh target/release/sonicterm-mac ci mac-${{ matrix.arch }}

      - name: Validate packaged macOS dmg
        timeout-minutes: 8
        run: |
          python3 scripts/test-macos-package.py \
            --dmg "dist/SonicTerm-ci-mac-${{ matrix.arch }}.dmg" \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-package-${{ matrix.arch }}" \
            --max-minimum-macos "${{ matrix.minimum }}"

      - name: Upload macOS package evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Evidence and logs only. The validated .dmg is a CI-local build, not
          # a release asset, and publishing it would invite use as one.
          name: sonicterm-macos-package-evidence-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/sonicterm-macos-package-${{ matrix.arch }}/package-evidence.json
          if-no-files-found: ignore

      - name: Upload macOS native smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-macos-smoke-logs-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sonicterm-macos-smoke-${{ matrix.arch }}.log
            ${{ runner.temp }}/sonicterm-macos-smoke-${{ matrix.arch }}/logs/**
            ${{ runner.temp }}/sonicterm-macos-package-${{ matrix.arch }}/**
          if-no-files-found: ignore

  macos:
    name: macos-14 / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [macos-core, macos-coverage, macos-smoke]
    if: always()
    steps:
      - name: Verify macOS shards
        timeout-minutes: 2
        shell: bash
        env:
          CORE: ${{ needs.macos-core.result }}
          COVERAGE: ${{ needs.macos-coverage.result }}
          SMOKE: ${{ needs.macos-smoke.result }}
        run: |
          for result in "$CORE" "$COVERAGE" "$SMOKE"; do
            test "$result" = "success"
          done

  windows-native:
    name: Windows native dependency cache
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Resolve vcpkg commit
        id: vcpkg
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        id: vcpkg-cache
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        timeout-minutes: 30
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Save vcpkg binaries (Cairo)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  windows-checks:
    name: Windows static and documentation gates
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [windows-native]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Resolve vcpkg commit
        id: vcpkg
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        timeout-minutes: 12
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-windows-latest
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all --check

      - name: Clippy
        timeout-minutes: 15
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate workspace manifests
        timeout-minutes: 2
        shell: bash
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Check declared rust-version against the lock
        timeout-minutes: 5
        shell: bash
        run: bash scripts/check-rust-version.sh

      - name: Check process exit paths
        timeout-minutes: 2
        shell: bash
        run: bash scripts/check-no-raw-process-exit.sh

      - name: Check window owner registration
        timeout-minutes: 2
        shell: bash
        run: bash scripts/check-window-owner-registration.sh

      - name: Check workflow supply chain
        timeout-minutes: 2
        shell: bash
        run: bash scripts/check-workflow-supply-chain.sh

      - name: Check authored Rust comments
        timeout-minutes: 5
        shell: bash
        run: bash scripts/check-authored-rust-comments.sh

      - name: Check public Rustdoc
        timeout-minutes: 10
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  windows-tests:
    name: Windows test and runtime gates
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [windows-native]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Resolve vcpkg commit
        id: vcpkg
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        timeout-minutes: 12
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-windows-latest
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: false

      - name: Run workspace unit and integration tests
        timeout-minutes: 35
        shell: bash
        run: bash scripts/check-workspace-crates.sh

      - name: Run workspace documentation tests
        timeout-minutes: 15
        run: cargo test --workspace --doc --no-fail-fast

      - name: Report host window capability
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test ci_host_capability_probe -- --nocapture

      - name: Report host adapter classification
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test ci_adapter_classification_probe -- --nocapture

      - name: Report renderer churn baseline
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test renderer_churn_baseline -- --nocapture

      - name: Require Windows GDI capability=EXERCISED
        timeout-minutes: 5
        shell: pwsh
        run: |
          python scripts/native-smoke-runner.py `
            --timeout-seconds 120 `
            --log-file "$env:RUNNER_TEMP\sonicterm-windows-gdi.log" `
            --require-capability EXERCISED `
            -- cargo test -p sonicterm-gpu --test windows_software_present_capability -- --nocapture

      - name: Upload Windows GDI probe log
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-windows-gdi-log-${{ github.sha }}
          path: ${{ runner.temp }}/sonicterm-windows-gdi.log
          if-no-files-found: ignore

      - name: Verify Windows WARP allocator baseline
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test windows_warp_allocator_baseline -- --nocapture

      - name: Verify Windows selection presentation
        timeout-minutes: 5
        run: cargo test -p sonicterm-app --test windows_software_selection_present -- --nocapture

      - name: Test MSI validator
        timeout-minutes: 5
        shell: pwsh
        run: .\scripts\validate-windows-msi_tests.ps1

      - name: Run release-note unit test
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-release-notes.sh

      - name: Test wiki publisher
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-wiki-publish.sh

      - name: Verify frozen PTY feasibility evidence
        timeout-minutes: 5
        shell: bash
        run: bash scripts/pty-backend-feasibility.sh --check

      - name: Verify resource inventory
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-resource-inventory.sh

      - name: Run deterministic soak control gate
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-soak-harness.sh

      - name: Test resource baseline evidence collector
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-resource-baseline-evidence.sh

      - name: Capture real resource baseline evidence
        id: capture_resource_baseline
        timeout-minutes: 10
        shell: bash
        run: |
          python_cmd=python3
          if ! command -v "$python_cmd" >/dev/null 2>&1; then
            python_cmd=python
          fi
          "$python_cmd" scripts/resource-baseline-evidence.py \
            --runner-label windows-latest \
            --output-dir target/v1.2.0-baseline/evidence-windows-latest

      - name: Upload resource baseline evidence
        if: ${{ !cancelled() && steps.capture_resource_baseline.conclusion != 'skipped' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-baseline-evidence-windows-latest
          path: target/v1.2.0-baseline/evidence-windows-latest
          if-no-files-found: error

  windows-smoke:
    name: Windows native runtime smoke
    runs-on: windows-latest
    timeout-minutes: 55
    needs: [windows-native]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Resolve vcpkg commit
        id: vcpkg
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        timeout-minutes: 12
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-unit-windows-latest
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: false

      - name: Build Windows release binary for runtime smoke
        timeout-minutes: 25
        run: cargo build --release -p sonicterm-windows

      - name: Require Windows native runtime smoke
        timeout-minutes: 3
        shell: pwsh
        run: |
          python scripts/native-smoke-runner.py `
            --timeout-seconds 45 `
            --state-dir "$env:RUNNER_TEMP\sonicterm-windows-smoke" `
            --log-file "$env:RUNNER_TEMP\sonicterm-windows-smoke.log" `
            -- ./target/release/sonicterm-windows.exe --runtime-smoke

      - name: Upload Windows native smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-windows-smoke-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sonicterm-windows-smoke.log
            ${{ runner.temp }}/sonicterm-windows-smoke/logs/**
          if-no-files-found: ignore

  windows:
    name: windows-latest / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [windows-native, windows-checks, windows-tests, windows-smoke]
    if: always()
    steps:
      - name: Verify Windows shards
        timeout-minutes: 2
        shell: bash
        env:
          NATIVE: ${{ needs.windows-native.result }}
          CHECKS: ${{ needs.windows-checks.result }}
          TESTS: ${{ needs.windows-tests.result }}
          SMOKE: ${{ needs.windows-smoke.result }}
        run: |
          for result in "$NATIVE" "$CHECKS" "$TESTS" "$SMOKE"; do
            test "$result" = "success"
          done

  linux-core:
    name: Ubuntu core gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ubuntu:22.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install runner and native dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config python3 \
            libcairo2-dev libfontconfig1-dev libwayland-dev libx11-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 \
            mesa-vulkan-drivers libvulkan1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-linux-ubuntu-22.04
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all --check

      - name: Clippy
        timeout-minutes: 15
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check public Rustdoc
        timeout-minutes: 10
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc -p sonicterm-resource --all-features --no-deps

      - name: Run workspace unit and integration tests
        timeout-minutes: 35
        run: bash scripts/check-workspace-crates.sh

      - name: Run workspace documentation tests
        timeout-minutes: 15
        run: cargo test --workspace --doc --no-fail-fast

      - name: Run source and release tooling gates
        timeout-minutes: 10
        run: |
          bash scripts/check-authored-rust-comments.sh
          bash scripts/check-no-raw-process-exit.sh
          bash scripts/check-rust-version.sh
          bash scripts/check-window-owner-registration.sh
          bash scripts/check-workflow-supply-chain.sh
          bash scripts/test-linux-packages.sh
          bash scripts/test-release-assets.sh
          bash scripts/test-release-notes.sh
          bash scripts/test-wiki-publish.sh

  linux-packages:
    name: Ubuntu package and runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ubuntu:22.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install runner, package, and runtime dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential zstd pkg-config python3 \
            libcairo2-dev libfontconfig1-dev libwayland-dev libx11-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 binutils dpkg-dev \
            file desktop-file-utils appstream lintian mesa-vulkan-drivers \
            libvulkan1 xvfb x11-utils weston

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Restore Cargo dependencies
        timeout-minutes: 10
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ env.CI_CACHE_NAMESPACE }}-linux-ubuntu-22.04
          add-job-id-key: false
          cache-workspace-crates: false
          save-if: false

      - name: Build Linux release binary
        timeout-minutes: 30
        run: cargo build --release -p sonicterm-linux

      - name: Build and validate Linux packages
        id: packages
        timeout-minutes: 15
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          members = set(metadata["workspace_members"])
          versions = {package["version"] for package in metadata["packages"] if package["id"] in members}
          if len(versions) != 1:
              raise SystemExit(f"workspace versions differ: {sorted(versions)}")
          print(versions.pop())
          ')"
          tag="v${version}"
          python3 scripts/prepare-release-assets.py check-version --tag "$tag"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            bash scripts/make-linux-packages.sh target/release/sonicterm "$tag" dist
          tarball="dist/SonicTerm-${tag}-linux-x86_64.tar.gz"
          deb="dist/SonicTerm-${tag}-linux-x86_64.deb"
          bash scripts/test-linux-packages.sh "$tarball" "$deb"
          desktop-file-validate \
            "dist/.linux-package-work/SonicTerm-${tag}-linux-x86_64/share/applications/com.d0n9x1n.SonicTerm.desktop"
          appstreamcli validate --no-net \
            "dist/.linux-package-work/SonicTerm-${tag}-linux-x86_64/share/metainfo/com.d0n9x1n.SonicTerm.metainfo.xml"
          if ! lintian "$deb"; then
            echo "::warning::lintian reported advisory Linux package findings"
          fi
          {
            echo "tag=$tag"
            echo "tarball=$tarball"
            echo "deb=$deb"
          } >> "$GITHUB_OUTPUT"

      - name: Run packaged X11 and Wayland smokes
        timeout-minutes: 5
        run: bash scripts/smoke-linux-packages.sh "${{ steps.packages.outputs.tarball }}" "${{ steps.packages.outputs.deb }}"

      - name: Upload Linux package smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-linux-smoke-logs-${{ github.sha }}
          path: sonicterm-*-smoke.log
          if-no-files-found: ignore

      - name: Upload Linux packages
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-linux-packages-${{ github.sha }}
          path: |
            ${{ steps.packages.outputs.tarball }}
            ${{ steps.packages.outputs.deb }}
          if-no-files-found: error

  linux:
    name: ubuntu 22.04 / workspace, packages, X11, Wayland
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [linux-core, linux-packages]
    if: always()
    steps:
      - name: Verify Ubuntu shards
        timeout-minutes: 2
        shell: bash
        env:
          CORE: ${{ needs.linux-core.result }}
          PACKAGES: ${{ needs.linux-packages.result }}
        run: |
          for result in "$CORE" "$PACKAGES"; do
            test "$result" = "success"
          done
