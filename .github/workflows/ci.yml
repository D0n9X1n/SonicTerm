name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  unit-tests:
    name: ${{ matrix.os }} / unit tests
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Resolve vcpkg commit (for cache key)
        id: vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $sha = (git -C $root rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg binaries (Cairo)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit-${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --all --check

      # Documented as a gate step but previously enforced only by whoever
      # remembered to run it, so a `-D warnings` violation could merge.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `ssh` is off by default, so no other step in this workflow compiles it:
      # `--all-targets` does not imply `--all-features`. Without this the
      # backend can stop building against a dependency's newer API and every
      # gate still reports green.
      - name: Clippy optional ssh backend
        run: cargo clippy -p sonicterm-io --features ssh --all-targets -- -D warnings

      # `shell: bash` because the matrix includes Windows, where the default
      # shell is PowerShell and `> /dev/null` would create a file named `null`
      # rather than discarding the output.
      - name: Validate workspace manifests
        shell: bash
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      # CI installs floating `stable`, so nothing here would otherwise notice
      # the declared minimum falling behind what the lockfile needs.
      - name: Check declared rust-version against the lock
        shell: bash
        run: bash scripts/check-rust-version.sh

      - name: Check process exit paths
        shell: bash
        run: bash scripts/check-no-raw-process-exit.sh

      - name: Check window owner registration
        shell: bash
        run: bash scripts/check-window-owner-registration.sh

      - name: Check authored Rust comments
        shell: bash
        run: bash scripts/check-authored-rust-comments.sh

      - name: Check public Rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Check optional ssh Rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p sonicterm-io --no-deps --features ssh

      - name: Run unit tests
        run: cargo test --workspace --lib --bins

      - name: Run per-crate unit/build gate
        shell: bash
        run: bash scripts/check-workspace-crates.sh

      # `--nocapture` deliberately: this probe reports through stdout, and a
      # passing test's stdout is swallowed. Its whole purpose is the printed
      # verdict — whether this runner can create a window, and therefore
      # whether the Windows software-path verification can be automated rather
      # than needing a person at a keyboard.
      - name: Report host window capability
        run: cargo test -p sonicterm-gpu --test ci_host_capability_probe -- --nocapture

      # `--nocapture` again: this probe exists to report which adapters the
      # runner offers and how the production predicate classifies them.
      # Exercising `Auto` is usually assumed to need a real software
      # rasterizer; this is what establishes whether the runner is one.
      - name: Report host adapter classification
        run: cargo test -p sonicterm-gpu --test ci_adapter_classification_probe -- --nocapture

      # `--nocapture` for the same reason as the probe above: this test's
      # verdict is its stdout. Without it, a run that compared eight cycles
      # and a run that returned early having measured nothing both report
      # `ok`, and the distinction is the whole point.
      - name: Report renderer churn baseline
        run: cargo test -p sonicterm-gpu --test renderer_churn_baseline -- --nocapture

      - name: Verify Windows software presentation capability
        if: runner.os == 'Windows'
        run: cargo test -p sonicterm-gpu --test windows_software_present_capability -- --nocapture

      - name: Verify Windows WARP allocator baseline
        if: runner.os == 'Windows'
        run: cargo test -p sonicterm-gpu --test windows_warp_allocator_baseline -- --nocapture

      - name: Verify Windows selection presentation
        if: runner.os == 'Windows'
        run: cargo test -p sonicterm-app --test windows_software_selection_present -- --nocapture

      - name: Run release-note unit test
        shell: bash
        run: bash scripts/test-release-notes.sh

      - name: Test wiki publisher
        shell: bash
        run: bash scripts/test-wiki-publish.sh

      - name: Verify frozen PTY feasibility evidence
        shell: bash
        run: bash scripts/pty-backend-feasibility.sh --check

      - name: Verify resource inventory
        shell: bash
        run: bash scripts/test-resource-inventory.sh

      - name: Run deterministic soak control gate
        shell: bash
        run: bash scripts/test-soak-harness.sh

      - name: Test resource baseline evidence collector
        shell: bash
        run: bash scripts/test-resource-baseline-evidence.sh

      - name: Capture real resource baseline evidence
        id: capture_resource_baseline
        shell: bash
        run: |
          python_cmd=python3
          if ! command -v "$python_cmd" >/dev/null 2>&1; then
            python_cmd=python
          fi
          "$python_cmd" scripts/resource-baseline-evidence.py \
            --runner-label "${{ matrix.os }}" \
            --output-dir "target/v1.2.0-baseline/evidence-${{ matrix.os }}"

      - name: Upload resource baseline evidence
        if: ${{ !cancelled() && steps.capture_resource_baseline.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v5
        with:
          name: resource-baseline-evidence-${{ matrix.os }}
          path: target/v1.2.0-baseline/evidence-${{ matrix.os }}
          if-no-files-found: error

      - name: Install cargo-llvm-cov
        if: runner.os == 'macOS'
        run: cargo install cargo-llvm-cov --locked

      - name: Run Rust logic coverage gate
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/rust-logic-coverage.sh

  linux:
    name: ubuntu 22.04 / workspace, packages, X11, Wayland
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install runner and native dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            zstd \
            pkg-config \
            libcairo2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            binutils \
            dpkg-dev \
            file \
            desktop-file-utils \
            appstream \
            lintian \
            mesa-vulkan-drivers \
            libvulkan1 \
            xvfb \
            x11-utils \
            weston \
            python3

      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ubuntu-22.04

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy optional ssh backend
        run: cargo clippy -p sonicterm-io --features ssh --all-targets -- -D warnings

      - name: Check public Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Check optional ssh Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p sonicterm-io --no-deps --features ssh

      - name: Run workspace unit tests
        run: cargo test --workspace --lib --bins

      - name: Run per-crate unit/build gate
        run: bash scripts/check-workspace-crates.sh

      - name: Run source and release tooling gates
        run: |
          bash scripts/check-authored-rust-comments.sh
          bash scripts/check-no-raw-process-exit.sh
          bash scripts/check-rust-version.sh
          bash scripts/check-window-owner-registration.sh
          bash scripts/test-linux-packages.sh
          bash scripts/test-release-assets.sh
          bash scripts/test-release-notes.sh
          bash scripts/test-wiki-publish.sh

      - name: Build Linux release binary
        run: cargo build --release -p sonicterm-linux

      - name: Build and validate Linux packages
        id: packages
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          members = set(metadata["workspace_members"])
          versions = {package["version"] for package in metadata["packages"] if package["id"] in members}
          if len(versions) != 1:
              raise SystemExit(f"workspace versions differ: {sorted(versions)}")
          print(versions.pop())
          ')"
          tag="v${version}"
          python3 scripts/prepare-release-assets.py check-version --tag "$tag"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            bash scripts/make-linux-packages.sh target/release/sonicterm "$tag" dist
          tarball="dist/SonicTerm-${tag}-linux-x86_64.tar.gz"
          deb="dist/SonicTerm-${tag}-linux-x86_64.deb"
          bash scripts/test-linux-packages.sh "$tarball" "$deb"
          desktop-file-validate \
            "dist/.linux-package-work/SonicTerm-${tag}-linux-x86_64/share/applications/com.d0n9x1n.SonicTerm.desktop"
          appstreamcli validate --no-net \
            "dist/.linux-package-work/SonicTerm-${tag}-linux-x86_64/share/metainfo/com.d0n9x1n.SonicTerm.metainfo.xml"
          if ! lintian "$deb"; then
            echo "::warning::lintian reported advisory Linux package findings"
          fi
          {
            echo "tag=$tag"
            echo "tarball=$tarball"
            echo "deb=$deb"
          } >> "$GITHUB_OUTPUT"

      - name: Run packaged X11 and Wayland smokes
        run: bash scripts/smoke-linux-packages.sh "${{ steps.packages.outputs.tarball }}" "${{ steps.packages.outputs.deb }}"

      - name: Upload Linux package smoke logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: sonicterm-linux-smoke-logs-${{ github.sha }}
          path: sonicterm-*-smoke.log
          if-no-files-found: ignore

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: sonicterm-linux-packages-${{ github.sha }}
          path: |
            ${{ steps.packages.outputs.tarball }}
            ${{ steps.packages.outputs.deb }}
          if-no-files-found: error
