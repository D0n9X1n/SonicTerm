name: Performance comparison

# The before/after table every performance pull request carries is measured here, on GitHub-hosted
# macOS and Windows runners, not on a developer's machine: a desk is in use, and its input, focus changes
# and load invalidate runs or widen the noise. A local run only shows that the tooling works. The hosted
# Windows runner has no GPU, so its table measures the software-rendering path.
#
# Two modes:
# - A pull request labelled `perf` (when the label is added, and on every push while it is set) gets a
#   quick comparison that fits a 30-minute budget: `--short` runs (every hold 5 s, smaller floods) and a
#   release profile without LTO, the same for both refs.
# - A release tag gets the full comparison against the previous release tag, with the shipping release
#   profile and full-length runs. It may take hours.
# Both split the scenario sets across five parallel jobs per platform. Each job builds both refs and runs its
# sets' base and head runs on its own runner, so a comparison never crosses runners or platforms.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ["v[0-9]*"]

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  compare:
    name: ${{ matrix.platform }} before/after comparison (${{ matrix.shard }})
    # Adding another label to a `perf` pull request does not start a second comparison.
    if: >-
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'perf'))
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Git Bash on Windows, so every platform runs the same step scripts.
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    strategy:
      # Every shard reports: one shard's failure must not hide the other sets' tables.
      fail-fast: false
      # Balanced by measured macOS PR-mode time (about 5 min of builds per job, then its runs): S7 alone is
      # about 11 min of runs, the other jobs 6-9 min. Windows uses the same shards; rebalance here when a
      # scenario's runs grow on either platform.
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            shard: S7
            scenarios: S7
          - platform: macOS
            runner: macos-14
            shard: S9-S10
            scenarios: S9 S10
          - platform: macOS
            runner: macos-14
            shard: S2-S10sync
            scenarios: S2 S10/sync
          - platform: macOS
            runner: macos-14
            shard: S4-S5-S11
            scenarios: S4 S5 S11
          - platform: macOS
            runner: macos-14
            shard: S1-S3-S6-S8-S12
            scenarios: S1 S3 S6 S8 S12
          - platform: Windows
            runner: windows-latest
            shard: S7
            scenarios: S7
          - platform: Windows
            runner: windows-latest
            shard: S9-S10
            scenarios: S9 S10
          - platform: Windows
            runner: windows-latest
            shard: S2-S10sync
            scenarios: S2 S10/sync
          - platform: Windows
            runner: windows-latest
            shard: S4-S5-S11
            scenarios: S4 S5 S11
          - platform: Windows
            runner: windows-latest
            shard: S1-S3-S6-S8-S12
            scenarios: S1 S3 S6 S8 S12
    # One comparison per pull request (or tag) and shard. A new push to a pull request makes the running
    # one obsolete; a release comparison is never cancelled.
    concurrency:
      group: perf-comparison-${{ github.event.pull_request.number || github.ref_name }}-${{ matrix.platform }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # The full history and tags, so the merge base and the previous release tag resolve; the commit
      # itself, not a pull request's merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Install native dependencies
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - name: Resolve vcpkg commit
        if: runner.os == 'Windows'
        id: vcpkg
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Restore only: CI's Windows jobs own this cache, so a comparison never writes it.
      - name: Restore vcpkg binaries (Cairo)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ci-v3-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ci-v3-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      # A pull request compares its merge base with its head; a release tag compares the previous
      # release tag with itself. The first release has nothing to compare against.
      - name: Choose the refs and the run length
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            base_sha=$(git merge-base "origin/$PR_BASE_REF" "$PR_HEAD_SHA")
            head_sha=$PR_HEAD_SHA
            length=short
          else
            head_sha=$GITHUB_SHA
            # Only a tag list that Git returned successfully and empty means a first release; any Git
            # error fails the job instead of passing as "nothing to compare".
            # `rev-list --parents` prints the commit and then its parents; a failed read fails the job.
            commit_and_parents=$(git rev-list --parents -n 1 "$GITHUB_SHA") || exit 1
            read -r _ parent_sha _ <<<"$commit_and_parents"
            if [ -z "$parent_sha" ]; then
              echo "The tagged commit has no parent, so there is no earlier release to compare." >>"$GITHUB_STEP_SUMMARY"
              echo "base=" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            earlier_tags=$(git tag --list 'v[0-9]*' --merged "$parent_sha") || exit 1
            if [ -z "$earlier_tags" ]; then
              echo "No earlier release tag, so there is nothing to compare." >>"$GITHUB_STEP_SUMMARY"
              echo "base=" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$parent_sha") || exit 1
            base_sha=$(git rev-parse --verify "$previous_tag^{commit}") || exit 1
            length=full
          fi
          {
            echo "base=$base_sha"
            echo "head=$head_sha"
            echo "length=$length"
          } >>"$GITHUB_OUTPUT"
          echo "base $base_sha, head $head_sha, $length runs"

      # A pull request's comparison must fit 30 minutes, and fat LTO with one codegen unit dominates its
      # two release builds. Both refs build with the same overrides, and the table's details name them.
      - name: Relax the release profile for a pull request
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_LTO=off"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
          } >>"$GITHUB_ENV"

      # The comparison bounds every build and run itself, and stops on a cleanup or schema failure.
      - name: Compare the base and the head
        if: steps.refs.outputs.base != ''
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          RUN_LENGTH: ${{ steps.refs.outputs.length }}
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          read -ra scenarios <<<"$SCENARIOS"
          # The hosted Windows image names its interpreter `python`; macOS has `python3`.
          python=python3
          if [ "$RUNNER_OS" = "Windows" ]; then
            python=python
          fi
          length_flags=()
          if [ "$RUN_LENGTH" = "short" ]; then
            length_flags=(--short)
          fi
          "$python" scripts/perf-compare.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --scenario "${scenarios[@]}" --runs 5 "${length_flags[@]}" --out "$RUNNER_TEMP/perf-comparison"

      - name: Publish the table in the job summary
        if: always() && steps.refs.outputs.base != ''
        run: |
          table="$RUNNER_TEMP/perf-comparison/comparison.md"
          if [ -f "$table" ]; then
            cat "$table" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison.md: the comparison stopped before writing it; see the step log." >>"$GITHUB_STEP_SUMMARY"
          fi

      # The whole evidence tree: the runner is discarded, so this is the only copy of each run's result.json,
      # progress.json, App logs and checkpoint footprints. perf-compare.py already leaves the workload fixtures out.
      - name: Upload the comparison evidence
        if: always() && steps.refs.outputs.base != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-comparison-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.platform }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/perf-comparison
          if-no-files-found: warn
