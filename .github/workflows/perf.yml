name: Performance comparison

# The before/after table every performance pull request carries is measured here, on GitHub-hosted
# macOS and Windows runners, not on a developer's machine: a desk is in use, and its input, focus changes
# and load invalidate runs or widen the noise. A local run only shows that the tooling works. The hosted
# Windows runner has no GPU, so its table measures the software-rendering path.
#
# scripts/perf-shards.json holds three profiles, each a list of partitions per platform; each partition is one
# comparison job:
# - `core`: a pull request labelled `perf` (when the label is added, and on every push while it is set). Two
#   partitions a platform run the reviewed core variants with `--short` runs (every hold 5 s, smaller floods),
#   five timed runs and one counters run a side, on a release profile without LTO that both refs share. It
#   must finish within 25 minutes of the run's creation, queue time included.
# - `full`: a pull request labelled `perf-full`. Three partitions a platform run every pull-request variant
#   with two counters runs a side and S9's laps set, on the same relaxed profile, within 45 minutes.
# - `release`: a release tag, compared with the previous release tag, every variant at full length with the
#   shipping release profile. It may take hours, and each job must stay under GitHub's 6-hour job limit.
#
# Jobs: `plan` decides eligibility, resolves both SHAs once and emits each platform's matrix from the profile, so
# a comparison job that starts late never re-resolves a moving base. Each comparison job builds both refs itself
# and runs them interleaved on its own runner, each from its own worktree, so a comparison never crosses
# runners. Every comparison passes `--require-base`, so a base that cannot build, list or fill its runs fails the
# job. `perf-result` passes only when the plan and both comparison jobs succeeded. A first release resolves no
# base, so every job succeeds without comparing.
#
# Only an eligible run publishes the check `Performance comparison result`. An ineligible run (another label
# on a perf pull request) skips every job; GitHub never evaluates a skipped job's `name:`, so its result check
# shows the raw name expression, never the real name, and it can never hide an eligible run's check. Merge
# evidence is that exact eligible run's result job, SUCCESS on the exact head, never a reading by check name alone.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ["v[0-9]*"]

# Nothing here writes to the repository.
permissions:
  contents: read

# Eligible runs of one pull request (or tag) share a group, so a newer eligible run cancels the older one
# whole; a cancelled run's result job still runs under always() and fails, never succeeds. Adding `perf-full`
# to a `perf` pull request is a newer eligible run, so the full comparison replaces the core one. Each
# ineligible run has a group of its own and cancels nothing. A running release comparison is never cancelled:
# a newer run of the same tag waits (GitHub keeps one waiting run per group). Re-running an older eligible run
# rejoins the group and cancels a newer one, so only the newest eligible run is re-run.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' ||
    ((contains(github.event.pull_request.labels.*.name, 'perf') ||
    contains(github.event.pull_request.labels.*.name, 'perf-full')) &&
    (github.event.action != 'labeled' || github.event.label.name == 'perf' ||
    github.event.label.name == 'perf-full'))) && format('perf-comparison-{0}', github.event.pull_request.number || github.ref_name) ||
    format('perf-ineligible-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: Plan the comparison
    # Adding another label to a perf pull request does not start a second comparison. The comparison jobs need
    # this job, so they run only when it ran and succeeded.
    if: >-
      github.event_name == 'push' ||
      ((contains(github.event.pull_request.labels.*.name, 'perf') ||
      contains(github.event.pull_request.labels.*.name, 'perf-full')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'perf' ||
      github.event.label.name == 'perf-full'))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
      length: ${{ steps.refs.outputs.length }}
      profile: ${{ steps.partitions.outputs.profile }}
      macos: ${{ steps.partitions.outputs.macos }}
      windows: ${{ steps.partitions.outputs.windows }}
    steps:
      # The full history and tags, so the merge base and the previous release tag resolve; the commit
      # itself, not a pull request's merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # A pull request compares its merge base with its head; a release tag compares the previous
      # release tag with itself. The first release has nothing to compare against.
      - name: Choose the refs and the run length
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            base_sha=$(git merge-base "origin/$PR_BASE_REF" "$PR_HEAD_SHA")
            head_sha=$PR_HEAD_SHA
            length=short
          else
            head_sha=$GITHUB_SHA
            # Only a tag list that Git returned successfully and empty means a first release; any Git
            # error fails the job instead of passing as "nothing to compare".
            # `rev-list --parents` prints the commit and then its parents; a failed read fails the job.
            commit_and_parents=$(git rev-list --parents -n 1 "$GITHUB_SHA") || exit 1
            read -r _ parent_sha _ <<<"$commit_and_parents"
            if [ -z "$parent_sha" ]; then
              echo "The tagged commit has no parent, so there is no earlier release to compare." >>"$GITHUB_STEP_SUMMARY"
              echo "base=" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            earlier_tags=$(git tag --list 'v[0-9]*' --merged "$parent_sha") || exit 1
            if [ -z "$earlier_tags" ]; then
              echo "No earlier release tag, so there is nothing to compare." >>"$GITHUB_STEP_SUMMARY"
              echo "base=" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$parent_sha") || exit 1
            base_sha=$(git rev-parse --verify "$previous_tag^{commit}") || exit 1
            length=full
          fi
          {
            echo "base=$base_sha"
            echo "head=$head_sha"
            echo "length=$length"
          } >>"$GITHUB_OUTPUT"
          echo "base $base_sha, head $head_sha, $length runs"

      # A tag runs `release`; a pull request runs `full` while it carries `perf-full`, else `core`. The script
      # checks the whole partition file first, so a layout that cannot run fails here, before any runner builds.
      # A first release still emits its matrices: each comparison job then skips its comparison.
      - name: Choose the profile and its partitions
        id: partitions
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'perf-full') }}
        run: |
          profile=core
          if [ "$EVENT" = "push" ]; then
            profile=release
          elif [ "$FULL_LABEL" = "true" ]; then
            profile=full
          fi
          matrices=$(python3 scripts/perf_shards.py "$profile")
          {
            echo "profile=$profile"
            echo "$matrices"
          } >>"$GITHUB_OUTPUT"
          echo "Profile \`$profile\` (scripts/perf-shards.json)." >>"$GITHUB_STEP_SUMMARY"

  compare-macos:
    name: ${{ matrix.platform }} before/after comparison (${{ matrix.partition }})
    # Implicitly also the plan's success: no partition runs after a skipped, failed or cancelled plan.
    needs: plan
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    strategy:
      # Every partition reports: one partition's failure must not hide the others' tables.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      # The full history, so the base commit is in the clone for its worktree; the commit itself, not a pull
      # request's merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install native dependencies
        run: brew install cairo pkg-config

      # A pull request's comparison must fit its budget, and fat LTO with one codegen unit dominates its
      # two release builds. Both refs build with the same overrides, and the table's details name them.
      - name: Relax the release profile for a pull request
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_LTO=off"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
          } >>"$GITHUB_ENV"

      # The comparison builds both refs, bounds every build and run itself, and stops on a cleanup or schema
      # failure; --require-base fails it when the base cannot build, list or fill its runs. A head that does not
      # declare perf-counters skips the counters set, and the table says so.
      - name: Compare the base and the head
        if: needs.plan.outputs.base != ''
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          RUN_LENGTH: ${{ needs.plan.outputs.length }}
          SELECTION: ${{ matrix.selection }}
          PERF_JOB_NAME: ${{ matrix.platform }} before/after comparison (${{ matrix.partition }})
          PERF_SHARD: ${{ matrix.partition }}
        run: |
          # The partition's variants and sampling, as scripts/perf_shards.py wrote them; a pull request runs short.
          read -ra selection <<<"$SELECTION"
          if [ "$RUN_LENGTH" = "short" ]; then
            selection+=(--short)
          fi
          python3 scripts/perf-compare.py --base "$BASE_SHA" --head "$HEAD_SHA" --require-base \
            "${selection[@]}" --out "$RUNNER_TEMP/perf-comparison"

      - name: Publish the table in the job summary
        if: always() && needs.plan.outputs.base != ''
        run: |
          table="$RUNNER_TEMP/perf-comparison/comparison.md"
          if [ -f "$table" ]; then
            cat "$table" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison.md: the comparison stopped before writing it; see the step log." >>"$GITHUB_STEP_SUMMARY"
          fi

      # The whole evidence tree: the runner is discarded, so this is the only copy of each run's result.json,
      # progress.json, timing.json, App logs and checkpoint footprints. perf-compare.py already leaves the
      # workload fixtures out. The attempt in the name keeps a rerun's evidence apart from the first attempt's.
      - name: Upload the comparison evidence
        if: always() && needs.plan.outputs.base != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-comparison-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.platform }}-${{ matrix.partition }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/perf-comparison
          if-no-files-found: warn

  compare-windows:
    name: ${{ matrix.platform }} before/after comparison (${{ matrix.partition }})
    needs: plan
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, so Windows runs the same step scripts as macOS.
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      # The full history, so the base commit is in the clone for its worktree; the commit itself, not a pull
      # request's merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Resolve vcpkg commit
        id: vcpkg
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "sha=$((git -C $root rev-parse HEAD).Trim())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Restore only: CI's Windows jobs own this cache, so a comparison never writes it.
      - name: Restore vcpkg binaries (Cairo)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ci-v3-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ci-v3-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo for Windows
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      # A pull request's comparison must fit its budget, and fat LTO with one codegen unit dominates its
      # two release builds. Both refs build with the same overrides, and the table's details name them.
      - name: Relax the release profile for a pull request
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_LTO=off"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
          } >>"$GITHUB_ENV"

      # The comparison builds both refs, bounds every build and run itself, and stops on a cleanup or schema
      # failure; --require-base fails it when the base cannot build, list or fill its runs.
      - name: Compare the base and the head
        if: needs.plan.outputs.base != ''
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          RUN_LENGTH: ${{ needs.plan.outputs.length }}
          SELECTION: ${{ matrix.selection }}
          PERF_JOB_NAME: ${{ matrix.platform }} before/after comparison (${{ matrix.partition }})
          PERF_SHARD: ${{ matrix.partition }}
        run: |
          # The partition's variants and sampling, as scripts/perf_shards.py wrote them; a pull request runs short.
          read -ra selection <<<"$SELECTION"
          if [ "$RUN_LENGTH" = "short" ]; then
            selection+=(--short)
          fi
          # The hosted Windows image names its interpreter `python`.
          python scripts/perf-compare.py --base "$BASE_SHA" --head "$HEAD_SHA" --require-base \
            "${selection[@]}" --out "$RUNNER_TEMP/perf-comparison"

      - name: Publish the table in the job summary
        if: always() && needs.plan.outputs.base != ''
        run: |
          table="$RUNNER_TEMP/perf-comparison/comparison.md"
          if [ -f "$table" ]; then
            cat "$table" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison.md: the comparison stopped before writing it; see the step log." >>"$GITHUB_STEP_SUMMARY"
          fi

      # The whole evidence tree: the runner is discarded, so this is the only copy of each run's result.json,
      # progress.json, timing.json, App logs and checkpoint footprints. perf-compare.py already leaves the
      # workload fixtures out. The attempt in the name keeps a rerun's evidence apart from the first attempt's.
      - name: Upload the comparison evidence
        if: always() && needs.plan.outputs.base != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-comparison-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.platform }}-${{ matrix.partition }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/perf-comparison
          if-no-files-found: warn

  # The one check to read: no checkout and no action, so nothing from the pull request's tree decides it. It
  # carries the eligibility itself, so a skipped plan never lets it pass. Its name is the real one only in an
  # eligible run; a skipped run shows this expression unevaluated, never the real name.
  perf-result:
    name: >-
      ${{ (github.event_name == 'push' ||
      ((contains(github.event.pull_request.labels.*.name, 'perf') ||
      contains(github.event.pull_request.labels.*.name, 'perf-full')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'perf' ||
      github.event.label.name == 'perf-full'))) && 'Performance comparison result' ||
      'Performance comparison result (not run)' }}
    runs-on: ubuntu-latest
    needs: [plan, compare-macos, compare-windows]
    if: >-
      always() && (github.event_name == 'push' ||
      ((contains(github.event.pull_request.labels.*.name, 'perf') ||
      contains(github.event.pull_request.labels.*.name, 'perf-full')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'perf' ||
      github.event.label.name == 'perf-full')))
    steps:
      - name: Require every comparison job to succeed
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          MACOS: ${{ needs.compare-macos.result }}
          WINDOWS: ${{ needs.compare-windows.result }}
        run: |
          for pair in "plan=$PLAN" "macOS=$MACOS" "Windows=$WINDOWS"; do
            [ "${pair#*=}" = "success" ] || { echo "${pair%%=*} job result: '${pair#*=}'" >&2; exit 1; }
          done
