name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Read-only for every job that compiles, packages, or runs a third-party
# action. Only `publish` re-grants write, so a compromised build or packaging
# dependency holds a token that cannot create or alter a release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0
  CI_CACHE_NAMESPACE: ci-v3
  CARGO_WIX_VERSION: "0.3.9"
  WIX_TOOLSET_VERSION: "3.14.1.20250415"

jobs:
  validate-release-tag:
    name: Validate release provenance and source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release-commit
        timeout-minutes: 2
        run: |
          release_sha="$(python3 scripts/prepare-release-assets.py resolve-commit --revision "$GITHUB_SHA")"
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        timeout-minutes: 5
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main

      - name: Verify exact successful main CI
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${RELEASE_SHA}&per_page=100" | \
            python3 scripts/prepare-release-assets.py check-main-ci --sha "$RELEASE_SHA"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable

      - name: Validate tag against every workspace package
        timeout-minutes: 5
        run: python3 scripts/prepare-release-assets.py check-version --tag "${{ github.ref_name }}"

      - name: Test release asset tooling
        timeout-minutes: 5
        run: bash scripts/test-release-assets.sh

  build-mac-x86_64:
    name: Build macOS x86_64 binary
    runs-on: macos-15-intel
    timeout-minutes: 55
    needs: [validate-release-tag]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Install native dependencies
        timeout-minutes: 10
        run: brew install cairo pkg-config

      - name: Build x86_64
        timeout-minutes: 30
        run: cargo build --release --target x86_64-apple-darwin -p sonicterm-mac

      - name: Require macOS native runtime smoke
        timeout-minutes: 3
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-x86_64-smoke" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-x86_64-smoke.log" \
            -- target/x86_64-apple-darwin/release/sonicterm-mac --runtime-smoke

      - name: Require macOS GPU frame-validation smoke
        timeout-minutes: 3
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 --scenario frame-validation \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-x86_64-frame-validation-smoke" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-x86_64-frame-validation-smoke.log" \
            -- target/x86_64-apple-darwin/release/sonicterm-mac --runtime-smoke

      - name: Require macOS GPU device-recovery smoke
        timeout-minutes: 3
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 --scenario device-recovery \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-x86_64-device-recovery-smoke" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-x86_64-device-recovery-smoke.log" \
            -- target/x86_64-apple-darwin/release/sonicterm-mac --runtime-smoke

      # Packaging runs here, on the architecture it targets, so the bundle that
      # ships is the one a host actually executed. Producing Intel bytes on an
      # Apple Silicon packager would sign off on a load closure never run.
      - name: Install packaging dependencies
        timeout-minutes: 10
        run: brew install create-dmg imagemagick

      - name: Bake icons
        timeout-minutes: 10
        run: bash scripts/bake-icons.sh

      - name: Verify x86_64 binary architecture
        timeout-minutes: 5
        run: |
          file target/x86_64-apple-darwin/release/sonicterm-mac
          test "$(lipo -archs target/x86_64-apple-darwin/release/sonicterm-mac)" = "x86_64"

      - name: Build, validate, and register x86_64 dmg
        timeout-minutes: 15
        env:
          # Declared floor for Intel, asserted as a ceiling. It is 15.0 because
          # the Intel runner is macOS 15; raising it is a policy decision, so a
          # bottle that pushes LC_BUILD_VERSION higher must fail rather than
          # silently narrow the supported host set.
          SONICTERM_MAX_MACOS_MINIMUM: "15.0"
        run: |
          bash scripts/make-macos-dmg.sh target/x86_64-apple-darwin/release/sonicterm-mac \
            "${{ github.ref_name }}" mac-x86_64
          python3 scripts/test-macos-package.py \
            --dmg "dist/SonicTerm-${{ github.ref_name }}-mac-x86_64.dmg" \
            --state-dir "$RUNNER_TEMP/sonicterm-release-package-x86_64" \
            --max-minimum-macos "15.0"
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "dist/SonicTerm-${{ github.ref_name }}-mac-x86_64.dmg" \
            --platform macos \
            --arch x86_64 \
            --kind dmg \
            --output dist/macos-x86_64-dmg.asset.json

      - name: Upload macOS native smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-macos-x86_64-release-smoke-logs
          path: |
            ${{ runner.temp }}/sonicterm-macos-x86_64-smoke.log
            ${{ runner.temp }}/sonicterm-macos-x86_64-frame-validation-smoke.log
            ${{ runner.temp }}/sonicterm-macos-x86_64-device-recovery-smoke.log
            ${{ runner.temp }}/sonicterm-macos-x86_64-smoke/logs/**
            ${{ runner.temp }}/sonicterm-macos-x86_64-frame-validation-smoke/logs/**
            ${{ runner.temp }}/sonicterm-macos-x86_64-device-recovery-smoke/logs/**
            ${{ runner.temp }}/sonicterm-release-package-x86_64/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: macos-packaged-x86_64
          path: |
            dist/SonicTerm-${{ github.ref_name }}-mac-x86_64.dmg
            dist/macos-x86_64-dmg.asset.json
          if-no-files-found: error

  build-mac-aarch64:
    name: Build macOS aarch64 binary
    runs-on: macos-14
    timeout-minutes: 55
    needs: [validate-release-tag]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install native dependencies
        timeout-minutes: 10
        run: brew install cairo pkg-config

      - name: Build aarch64
        timeout-minutes: 30
        run: cargo build --release --target aarch64-apple-darwin -p sonicterm-mac

      - name: Require macOS native runtime smoke
        timeout-minutes: 3
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-aarch64-smoke" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-aarch64-smoke.log" \
            -- target/aarch64-apple-darwin/release/sonicterm-mac --runtime-smoke

      - name: Require macOS GPU frame-validation smoke
        timeout-minutes: 3
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 --scenario frame-validation \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-aarch64-frame-validation-smoke" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-aarch64-frame-validation-smoke.log" \
            -- target/aarch64-apple-darwin/release/sonicterm-mac --runtime-smoke

      - name: Require macOS GPU device-recovery smoke
        timeout-minutes: 3
        run: |
          python3 scripts/native-smoke-runner.py \
            --timeout-seconds 45 --scenario device-recovery \
            --state-dir "$RUNNER_TEMP/sonicterm-macos-aarch64-device-recovery-smoke" \
            --log-file "$RUNNER_TEMP/sonicterm-macos-aarch64-device-recovery-smoke.log" \
            -- target/aarch64-apple-darwin/release/sonicterm-mac --runtime-smoke

      # Packaging runs here, on the architecture it targets, so the bundle that
      # ships is the one a host actually executed. Producing Intel bytes on an
      # Apple Silicon packager would sign off on a load closure never run.
      - name: Install packaging dependencies
        timeout-minutes: 10
        run: brew install create-dmg imagemagick

      - name: Bake icons
        timeout-minutes: 10
        run: bash scripts/bake-icons.sh

      - name: Verify aarch64 binary architecture
        timeout-minutes: 5
        run: |
          file target/aarch64-apple-darwin/release/sonicterm-mac
          test "$(lipo -archs target/aarch64-apple-darwin/release/sonicterm-mac)" = "arm64"

      - name: Build, validate, and register aarch64 dmg
        timeout-minutes: 15
        env:
          # Declared floor for Apple Silicon, asserted as a ceiling: a bottle or
          # SDK that raises LC_BUILD_VERSION fails here instead of quietly
          # shipping a build that excludes macOS 14 hosts.
          SONICTERM_MAX_MACOS_MINIMUM: "14.0"
        run: |
          bash scripts/make-macos-dmg.sh target/aarch64-apple-darwin/release/sonicterm-mac \
            "${{ github.ref_name }}" mac-aarch64
          python3 scripts/test-macos-package.py \
            --dmg "dist/SonicTerm-${{ github.ref_name }}-mac-aarch64.dmg" \
            --state-dir "$RUNNER_TEMP/sonicterm-release-package-aarch64" \
            --max-minimum-macos "14.0"
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "dist/SonicTerm-${{ github.ref_name }}-mac-aarch64.dmg" \
            --platform macos \
            --arch aarch64 \
            --kind dmg \
            --output dist/macos-aarch64-dmg.asset.json

      - name: Upload macOS native smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-macos-aarch64-release-smoke-logs
          path: |
            ${{ runner.temp }}/sonicterm-macos-aarch64-smoke.log
            ${{ runner.temp }}/sonicterm-macos-aarch64-frame-validation-smoke.log
            ${{ runner.temp }}/sonicterm-macos-aarch64-device-recovery-smoke.log
            ${{ runner.temp }}/sonicterm-macos-aarch64-smoke/logs/**
            ${{ runner.temp }}/sonicterm-macos-aarch64-frame-validation-smoke/logs/**
            ${{ runner.temp }}/sonicterm-macos-aarch64-device-recovery-smoke/logs/**
            ${{ runner.temp }}/sonicterm-release-package-aarch64/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: macos-packaged-aarch64
          path: |
            dist/SonicTerm-${{ github.ref_name }}-mac-aarch64.dmg
            dist/macos-aarch64-dmg.asset.json
          if-no-files-found: error

  package-mac:
    name: Package macOS dmg
    runs-on: macos-14
    timeout-minutes: 20
    needs: [build-mac-x86_64, build-mac-aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      # Each .dmg was assembled, signed, and validated on the architecture it
      # targets. This job only consolidates those bytes under the artifact name
      # `publish` already consumes; repackaging here would rebuild the Intel
      # bundle on an Apple Silicon host and discard the tested artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 5
        with:
          name: macos-packaged-aarch64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 5
        with:
          name: macos-packaged-x86_64
          path: dist

      # Presence and fragment metadata only. The sha256 each fragment records is
      # re-derived from the bytes on disk by `consolidate` in `publish`, so a
      # corrupted transfer fails there rather than passing silently here.
      - name: Verify both architecture dmgs and fragment metadata
        timeout-minutes: 5
        shell: bash
        run: |
          for arch in aarch64 x86_64; do
            name="SonicTerm-${{ github.ref_name }}-mac-${arch}.dmg"
            fragment="dist/macos-${arch}-dmg.asset.json"
            test -f "dist/$name"
            test -f "$fragment"
            python3 -c "import json,sys; a=json.load(open(sys.argv[1]))['asset']; x={'platform':'macos','kind':'dmg','arch':sys.argv[2],'name':sys.argv[3],'path':sys.argv[3]}; bad=[k for k,v in x.items() if a.get(k)!=v]; sys.exit('fragment field mismatch in %s: %s' % (sys.argv[1],bad) if bad else 0)" "$fragment" "$arch" "$name"
          done
          ls -lh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: release-assets-macos
          path: |
            dist/SonicTerm-${{ github.ref_name }}-mac-aarch64.dmg
            dist/SonicTerm-${{ github.ref_name }}-mac-x86_64.dmg
            dist/macos-aarch64-dmg.asset.json
            dist/macos-x86_64-dmg.asset.json
          if-no-files-found: error

  build-windows:
    name: Build Windows msi
    runs-on: windows-latest
    timeout-minutes: 55
    needs: [validate-release-tag]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust target
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Resolve vcpkg commit (for cache key)
        id: vcpkg
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $sha = (git -C $root rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binaries (Cairo)
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            ${{ env.CI_CACHE_NAMESPACE }}-vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo
        timeout-minutes: 30
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - name: Install cargo-wix
        timeout-minutes: 10
        run: cargo install cargo-wix --version "${{ env.CARGO_WIX_VERSION }}" --locked

      - name: Install WiX Toolset
        timeout-minutes: 10
        run: |
          choco install wixtoolset --version "${{ env.WIX_TOOLSET_VERSION }}" --no-progress -y
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release binary
        timeout-minutes: 30
        run: cargo build --release --target x86_64-pc-windows-msvc -p sonicterm-windows

      - name: Require Windows native runtime smoke
        timeout-minutes: 3
        shell: pwsh
        run: |
          python scripts/native-smoke-runner.py `
            --timeout-seconds 45 `
            --state-dir "$env:RUNNER_TEMP\sonicterm-release-windows-smoke" `
            --log-file "$env:RUNNER_TEMP\sonicterm-release-windows-smoke.log" `
            -- ./target/x86_64-pc-windows-msvc/release/sonicterm-windows.exe --runtime-smoke

      - name: Require Windows GPU frame-validation smoke
        timeout-minutes: 3
        shell: pwsh
        run: |
          python scripts/native-smoke-runner.py `
            --timeout-seconds 45 --scenario frame-validation `
            --state-dir "$env:RUNNER_TEMP\sonicterm-release-windows-frame-validation-smoke" `
            --log-file "$env:RUNNER_TEMP\sonicterm-release-windows-frame-validation-smoke.log" `
            -- ./target/x86_64-pc-windows-msvc/release/sonicterm-windows.exe --runtime-smoke

      - name: Require Windows GPU device-recovery smoke
        timeout-minutes: 3
        shell: pwsh
        run: |
          python scripts/native-smoke-runner.py `
            --timeout-seconds 45 --scenario device-recovery `
            --state-dir "$env:RUNNER_TEMP\sonicterm-release-windows-device-recovery-smoke" `
            --log-file "$env:RUNNER_TEMP\sonicterm-release-windows-device-recovery-smoke.log" `
            -- ./target/x86_64-pc-windows-msvc/release/sonicterm-windows.exe --runtime-smoke

      - name: Build and register msi asset
        id: build-msi
        timeout-minutes: 10
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq sonicterm-windows |
            Select-Object -ExpandProperty version
          $numericVersion = ($version -split '[-+]')[0]
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location crates\sonicterm-windows
          cargo wix --package sonicterm-windows `
            --target x86_64-pc-windows-msvc `
            --install-version $numericVersion `
            --no-build --nocapture --output ..\..\dist\
          Pop-Location
          $packages = @(Get-ChildItem dist -Filter *.msi)
          if ($packages.Count -ne 1) {
            throw "Expected one MSI from cargo-wix, found $($packages.Count)"
          }
          $name = "SonicTerm-${{ github.ref_name }}-windows-x86_64.msi"
          Move-Item -LiteralPath $packages[0].FullName -Destination "dist\$name"
          "path=dist\$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          python scripts\prepare-release-assets.py fragment `
            --tag "${{ github.ref_name }}" `
            --asset "dist\$name" `
            --platform windows `
            --arch x86_64 `
            --kind msi `
            --output dist\windows-x86_64-msi.asset.json

      - name: Validate MSI metadata
        timeout-minutes: 5
        shell: pwsh
        run: |
          .\scripts\validate-windows-msi.ps1 `
            -MsiPath "${{ steps.build-msi.outputs.path }}" `
            -ExpectedVersion "v${{ steps.build-msi.outputs.version }}"

      - name: Upload Windows native smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-windows-release-smoke-logs
          path: |
            ${{ runner.temp }}/sonicterm-release-windows-smoke.log
            ${{ runner.temp }}/sonicterm-release-windows-frame-validation-smoke.log
            ${{ runner.temp }}/sonicterm-release-windows-device-recovery-smoke.log
            ${{ runner.temp }}/sonicterm-release-windows-smoke/logs/**
            ${{ runner.temp }}/sonicterm-release-windows-frame-validation-smoke/logs/**
            ${{ runner.temp }}/sonicterm-release-windows-device-recovery-smoke/logs/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: release-assets-windows
          path: |
            dist/SonicTerm-${{ github.ref_name }}-windows-x86_64.msi
            dist/windows-x86_64-msi.asset.json
          if-no-files-found: error

  package-linux:
    name: Package Linux deb and tar.gz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [validate-release-tag]
    container: ubuntu:22.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install runner, package, and runtime dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            zstd \
            pkg-config \
            libcairo2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            binutils \
            dpkg-dev \
            file \
            desktop-file-utils \
            appstream \
            lintian \
            mesa-vulkan-drivers \
            libvulkan1 \
            xvfb \
            x11-utils \
            weston \
            python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable

      - name: Build Linux release binary
        timeout-minutes: 30
        run: cargo build --release -p sonicterm-linux

      - name: Build, validate, and register Linux packages
        timeout-minutes: 10
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            bash scripts/make-linux-packages.sh \
              target/release/sonicterm \
              "${{ github.ref_name }}" \
              dist
          tarball="dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz"
          deb="dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb"
          bash scripts/test-linux-packages.sh "$tarball" "$deb"
          desktop-file-validate \
            "dist/.linux-package-work/SonicTerm-${{ github.ref_name }}-linux-x86_64/share/applications/com.d0n9x1n.SonicTerm.desktop"
          appstreamcli validate --no-net \
            "dist/.linux-package-work/SonicTerm-${{ github.ref_name }}-linux-x86_64/share/metainfo/com.d0n9x1n.SonicTerm.metainfo.xml"
          if ! lintian "$deb"; then
            echo "::warning::lintian reported advisory Linux package findings"
          fi
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "$tarball" \
            --platform linux \
            --arch x86_64 \
            --kind tar.gz \
            --output dist/linux-x86_64-tar-gz.asset.json
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "$deb" \
            --platform linux \
            --arch x86_64 \
            --kind deb \
            --output dist/linux-x86_64-deb.asset.json

      - name: Run packaged X11 and Wayland smokes
        timeout-minutes: 5
        run: |
          bash scripts/smoke-linux-packages.sh \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb"

      - name: Run packaged GPU frame-validation smokes
        timeout-minutes: 5
        run: |
          bash scripts/smoke-linux-packages.sh \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb" frame-validation

      - name: Run packaged GPU device-recovery smokes
        timeout-minutes: 5
        run: |
          bash scripts/smoke-linux-packages.sh \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb" device-recovery

      - name: Upload Linux package smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicterm-linux-release-smoke-logs
          path: sonicterm-*-smoke.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: release-assets-linux
          path: |
            dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb
            dist/linux-x86_64-tar-gz.asset.json
            dist/linux-x86_64-deb.asset.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [package-mac, build-windows, package-linux]
    # The single write boundary of the release: it uploads the consolidated,
    # checksum-validated asset set. Every job that produced those bytes ran
    # with a read-only token, so this is the only step that can publish them.
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 5
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Consolidate and validate release assets
        id: assets
        timeout-minutes: 5
        shell: bash
        run: |
          python3 scripts/prepare-release-assets.py consolidate \
            --tag "${{ github.ref_name }}" \
            --dist dist
          {
            echo 'paths<<RELEASE_ASSETS'
            cat dist/release-upload-paths.txt
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Generate release notes
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-notes.sh \
            "${{ github.ref_name }}" \
            dist/release-assets.json \
            > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        timeout-minutes: 10
        with:
          tag_name: ${{ github.ref_name }}
          name: SonicTerm ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.assets.outputs.paths }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
