name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Read-only for every job that compiles, packages, or runs a third-party
# action. Only `publish` re-grants write, so a compromised build or packaging
# dependency holds a token that cannot create or alter a release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  validate-release-tag:
    name: Validate release tag and workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable

      - name: Validate tag against every workspace package
        timeout-minutes: 5
        run: python3 scripts/prepare-release-assets.py check-version --tag "${{ github.ref_name }}"

      - name: Test release asset tooling
        timeout-minutes: 5
        run: bash scripts/test-release-assets.sh

  unit-tests-mac:
    name: macOS / unit tests
    runs-on: macos-14
    timeout-minutes: 45
    needs: [validate-release-tag]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          shared-key: release-unit-macos-14
      - name: Run unit tests
        timeout-minutes: 20
        run: cargo test --workspace --lib --bins

      - name: Run per-crate unit/build gate
        timeout-minutes: 30
        shell: bash
        run: bash scripts/check-workspace-crates.sh

      - name: Run release-note unit test
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-release-notes.sh

  unit-tests-windows:
    name: Windows / unit tests
    runs-on: windows-latest
    timeout-minutes: 120
    needs: [validate-release-tag]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable

      - name: Resolve vcpkg commit (for cache key)
        id: vcpkg
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $sha = (git -C $root rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg binaries (Cairo)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo
        timeout-minutes: 30
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          shared-key: release-unit-windows
      - name: Run unit tests
        timeout-minutes: 30
        run: cargo test --workspace --lib --bins

      - name: Run per-crate unit/build gate
        timeout-minutes: 60
        shell: bash
        run: bash scripts/check-workspace-crates.sh

      - name: Verify Windows software presentation capability
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test windows_software_present_capability -- --nocapture

      - name: Verify Windows WARP allocator baseline
        timeout-minutes: 5
        run: cargo test -p sonicterm-gpu --test windows_warp_allocator_baseline -- --nocapture

      - name: Verify Windows selection presentation
        timeout-minutes: 5
        run: cargo test -p sonicterm-app --test windows_software_selection_present -- --nocapture

      - name: Run release-note unit test
        timeout-minutes: 5
        shell: bash
        run: bash scripts/test-release-notes.sh

  unit-tests-linux:
    name: Linux / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [validate-release-tag]
    container: ubuntu:22.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install runner and native dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            zstd \
            pkg-config \
            libcairo2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            libvulkan1 \
            python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          shared-key: release-unit-linux-ubuntu-22.04

      - name: Run unit tests
        timeout-minutes: 20
        run: cargo test --workspace --lib --bins

      - name: Run per-crate unit/build gate
        timeout-minutes: 30
        run: bash scripts/check-workspace-crates.sh

      - name: Run Linux release tooling tests
        timeout-minutes: 5
        run: |
          bash scripts/test-linux-packages.sh
          bash scripts/test-release-assets.sh
          bash scripts/test-release-notes.sh

  build-mac-x86_64:
    name: Build macOS x86_64 binary
    runs-on: macos-15-intel
    timeout-minutes: 45
    needs: [unit-tests-mac]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Install native dependencies
        timeout-minutes: 10
        run: brew install cairo pkg-config

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          shared-key: release-mac-x86_64

      - name: Build x86_64
        timeout-minutes: 30
        run: cargo build --release --target x86_64-apple-darwin -p sonicterm-mac

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        timeout-minutes: 5
        with:
          name: sonicterm-mac-x86_64
          path: target/x86_64-apple-darwin/release/sonicterm-mac

  build-mac-aarch64:
    name: Build macOS aarch64 binary
    runs-on: macos-14
    timeout-minutes: 30
    needs: [unit-tests-mac]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install native dependencies
        timeout-minutes: 10
        run: brew install cairo pkg-config

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          shared-key: release-mac-aarch64

      - name: Build aarch64
        timeout-minutes: 20
        run: cargo build --release --target aarch64-apple-darwin -p sonicterm-mac

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        timeout-minutes: 5
        with:
          name: sonicterm-mac-aarch64
          path: target/aarch64-apple-darwin/release/sonicterm-mac

  package-mac:
    name: Package macOS dmg
    runs-on: macos-14
    timeout-minutes: 30
    needs: [build-mac-x86_64, build-mac-aarch64]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        timeout-minutes: 5
        with:
          name: sonicterm-mac-x86_64
          path: dist/x86_64

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        timeout-minutes: 5
        with:
          name: sonicterm-mac-aarch64
          path: dist/aarch64

      - name: Verify macOS release binaries
        timeout-minutes: 5
        run: |
          chmod +x dist/x86_64/sonicterm-mac dist/aarch64/sonicterm-mac
          file dist/x86_64/sonicterm-mac
          file dist/aarch64/sonicterm-mac
          test "$(lipo -archs dist/x86_64/sonicterm-mac)" = "x86_64"
          test "$(lipo -archs dist/aarch64/sonicterm-mac)" = "arm64"

      - name: Build icons
        timeout-minutes: 10
        run: |
          brew install create-dmg imagemagick
          bash scripts/bake-icons.sh

      - name: Build and register dmg assets
        timeout-minutes: 10
        run: |
          bash scripts/make-macos-dmg.sh dist/aarch64/sonicterm-mac "${{ github.ref_name }}" mac-aarch64
          bash scripts/make-macos-dmg.sh dist/x86_64/sonicterm-mac "${{ github.ref_name }}" mac-x86_64
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "dist/SonicTerm-${{ github.ref_name }}-mac-aarch64.dmg" \
            --platform macos \
            --arch aarch64 \
            --kind dmg \
            --output dist/macos-aarch64-dmg.asset.json
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "dist/SonicTerm-${{ github.ref_name }}-mac-x86_64.dmg" \
            --platform macos \
            --arch x86_64 \
            --kind dmg \
            --output dist/macos-x86_64-dmg.asset.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        timeout-minutes: 5
        with:
          name: release-assets-macos
          path: |
            dist/SonicTerm-${{ github.ref_name }}-mac-aarch64.dmg
            dist/SonicTerm-${{ github.ref_name }}-mac-x86_64.dmg
            dist/macos-aarch64-dmg.asset.json
            dist/macos-x86_64-dmg.asset.json
          if-no-files-found: error

  build-windows:
    name: Build Windows msi
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [unit-tests-windows]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install Rust target
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Resolve vcpkg commit (for cache key)
        id: vcpkg
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $sha = (git -C $root rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg binaries (Cairo)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-cairo-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.sha }}-${{ hashFiles('scripts/setup-windows-cairo.ps1') }}
          restore-keys: |
            vcpkg-cairo-${{ runner.os }}-

      - name: Install Cairo
        timeout-minutes: 30
        shell: pwsh
        run: .\scripts\setup-windows-cairo.ps1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          shared-key: release-windows

      - name: Install cargo-wix
        timeout-minutes: 10
        run: cargo install cargo-wix --locked

      - name: Install WiX Toolset
        timeout-minutes: 10
        run: |
          choco install wixtoolset --no-progress -y
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release binary
        timeout-minutes: 20
        run: cargo build --release --target x86_64-pc-windows-msvc -p sonicterm-windows

      - name: Build and register msi asset
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location crates\sonicterm-windows
          cargo wix --package sonicterm-windows --no-build --nocapture --output ..\..\dist\
          Pop-Location
          $packages = @(Get-ChildItem dist -Filter *.msi)
          if ($packages.Count -ne 1) {
            throw "Expected one MSI from cargo-wix, found $($packages.Count)"
          }
          $name = "SonicTerm-${{ github.ref_name }}-windows-x86_64.msi"
          Move-Item -LiteralPath $packages[0].FullName -Destination "dist\$name"
          python scripts\prepare-release-assets.py fragment `
            --tag "${{ github.ref_name }}" `
            --asset "dist\$name" `
            --platform windows `
            --arch x86_64 `
            --kind msi `
            --output dist\windows-x86_64-msi.asset.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        timeout-minutes: 5
        with:
          name: release-assets-windows
          path: |
            dist/SonicTerm-${{ github.ref_name }}-windows-x86_64.msi
            dist/windows-x86_64-msi.asset.json
          if-no-files-found: error

  package-linux:
    name: Package Linux deb and tar.gz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests-linux]
    container: ubuntu:22.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install runner, package, and runtime dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            zstd \
            pkg-config \
            libcairo2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            binutils \
            dpkg-dev \
            file \
            desktop-file-utils \
            appstream \
            lintian \
            mesa-vulkan-drivers \
            libvulkan1 \
            xvfb \
            x11-utils \
            weston \
            python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 5
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          shared-key: release-linux-ubuntu-22.04

      - name: Build Linux release binary
        timeout-minutes: 20
        run: cargo build --release -p sonicterm-linux

      - name: Build, validate, and register Linux packages
        timeout-minutes: 10
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            bash scripts/make-linux-packages.sh \
              target/release/sonicterm \
              "${{ github.ref_name }}" \
              dist
          tarball="dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz"
          deb="dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb"
          bash scripts/test-linux-packages.sh "$tarball" "$deb"
          desktop-file-validate \
            "dist/.linux-package-work/SonicTerm-${{ github.ref_name }}-linux-x86_64/share/applications/com.d0n9x1n.SonicTerm.desktop"
          appstreamcli validate --no-net \
            "dist/.linux-package-work/SonicTerm-${{ github.ref_name }}-linux-x86_64/share/metainfo/com.d0n9x1n.SonicTerm.metainfo.xml"
          if ! lintian "$deb"; then
            echo "::warning::lintian reported advisory Linux package findings"
          fi
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "$tarball" \
            --platform linux \
            --arch x86_64 \
            --kind tar.gz \
            --output dist/linux-x86_64-tar-gz.asset.json
          python3 scripts/prepare-release-assets.py fragment \
            --tag "${{ github.ref_name }}" \
            --asset "$deb" \
            --platform linux \
            --arch x86_64 \
            --kind deb \
            --output dist/linux-x86_64-deb.asset.json

      - name: Run packaged X11 and Wayland smokes
        timeout-minutes: 5
        run: |
          bash scripts/smoke-linux-packages.sh \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            "dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb"

      - name: Upload Linux package smoke logs
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sonicterm-linux-release-smoke-logs
          path: sonicterm-*-smoke.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        timeout-minutes: 5
        with:
          name: release-assets-linux
          path: |
            dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/SonicTerm-${{ github.ref_name }}-linux-x86_64.deb
            dist/linux-x86_64-tar-gz.asset.json
            dist/linux-x86_64-deb.asset.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [package-mac, build-windows, package-linux]
    # The single write boundary of the release: it uploads the consolidated,
    # checksum-validated asset set. Every job that produced those bytes ran
    # with a read-only token, so this is the only step that can publish them.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        timeout-minutes: 5
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Consolidate and validate release assets
        id: assets
        timeout-minutes: 5
        shell: bash
        run: |
          python3 scripts/prepare-release-assets.py consolidate \
            --tag "${{ github.ref_name }}" \
            --dist dist
          {
            echo 'paths<<RELEASE_ASSETS'
            cat dist/release-upload-paths.txt
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Generate release notes
        timeout-minutes: 5
        run: |
          bash scripts/release-notes.sh \
            "${{ github.ref_name }}" \
            dist/release-assets.json \
            > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        timeout-minutes: 10
        with:
          tag_name: ${{ github.ref_name }}
          name: SonicTerm ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.assets.outputs.paths }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
