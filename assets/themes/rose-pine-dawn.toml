# Rosé Pine Dawn: the light Rosé Pine variant. Terminal colors are the
# official rose-pine/kitty port (dist/rose-pine-dawn.conf, MIT License).
# The bar is the port's active tab color, Rosé Pine's overlay.
name = "Rose Pine Dawn"
appearance = "light"

[colors]
background   = "#faf4ed"
foreground   = "#575279"
cursor       = "#cecacd"
cursor_text  = "#575279"
selection_bg = "#dfdad9"
selection_fg = "#575279"

[colors.ansi]
black   = "#f2e9e1"
red     = "#b4637a"
green   = "#286983"
yellow  = "#ea9d34"
blue    = "#56949f"
magenta = "#907aa9"
cyan    = "#d7827e"
white   = "#575279"

[colors.bright]
black   = "#9893a5"
red     = "#b4637a"
green   = "#286983"
yellow  = "#ea9d34"
blue    = "#56949f"
magenta = "#907aa9"
cyan    = "#d7827e"
white   = "#575279"

[colors.tab]
bar_bg          = "#f2e9e1"
active_bg       = "#faf4ed"
active_fg       = "#575279"
inactive_bg     = "#f2e9e1"
inactive_fg     = "#797593"
hover_bg        = "#dfdad9"
close_button_fg = "#b4637a"
