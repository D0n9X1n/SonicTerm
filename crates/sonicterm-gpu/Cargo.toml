[package]
name = "sonicterm-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — GPU pipeline primitives (quad, text, atlas upload)"

[lints]
workspace = true

[dependencies]
sonicterm-types.workspace = true
sonicterm-text.workspace = true
sonicterm-render-model.workspace = true
sonicterm-engine.workspace = true
# Block geometry bypasses font fallback and uses a distinct atlas key space.
sonicterm-block-glyph.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
winit.workspace = true
anyhow.workspace = true
tracing.workspace = true
pollster.workspace = true
unicode-width.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tracing-subscriber.workspace = true
