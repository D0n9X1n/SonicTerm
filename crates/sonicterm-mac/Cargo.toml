[package]
name = "sonicterm-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — macOS app"

[lints]
workspace = true

[dependencies]
sonicterm-app.workspace = true
sonicterm-app-core.workspace = true
sonicterm-cfg.workspace = true
sonicterm-logging.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSURL",
    "NSNotification",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "objc2-core-services",
] }
objc2-core-services = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSWorkspace",
] }
raw-window-handle = { workspace = true }

[[bin]]
name = "sonicterm-mac"
path = "src/main.rs"

[dev-dependencies]
roxmltree = "0.21"
