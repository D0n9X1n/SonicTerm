[package]
authors.workspace = true
name = "sonicterm-harfbuzz"
autotests = false
version.workspace = true
edition = "2018"
links = "harfbuzz"
build = "build.rs"
publish = false
license.workspace = true
repository.workspace = true
description = "SonicTerm Terminal - HarfBuzz native binding backend"

[dependencies]
freetype = { package = "sonicterm-freetype", path = "../sonicterm-freetype" }

[build-dependencies]
cc.workspace = true

# Integration tests (autotests disabled; unit tests live in tests/*_tests.rs
# and are #[path]-included from src for private access).

[[test]]
name = "smoke"
path = "tests/smoke.rs"
