[package]
name = "sonicterm-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — absorbed WezTerm font stack, shaping, fallback, and rasterization"

[lints]
workspace = true

[features]
vendor-jetbrains = []
vendor-roboto = []
vendor-noto-emoji = []
vendor-nerd-font-symbols = []

[dependencies]
anyhow.workspace = true
cairo-rs = { version = "0.22", default-features = false }
config.workspace = true
encoding_rs = "0.8"
enum-display-derive = "0.1"
euclid = { version = "0.22", default-features = false }
freetype.workspace = true
harfbuzz.workspace = true
image = "0.25"
lazy_static = "1.4"
log = "0.4"
memmap2 = "0.9"
metrics = "0.24"
num = "0.4"
ordered-float = { version = "5", features = ["std"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true
thiserror.workspace = true
walkdir = "2.5"

[target.'cfg(any(target_os = "android", all(unix, not(target_os = "macos"))))'.dependencies]
fontconfig.workspace = true

[target."cfg(windows)".dependencies]
dwrote = "0.11"
winapi = { version = "0.3", features = ["winbase"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.1"
core-foundation = "=0.10.1"
core-text = "=22.0.0"
objc = "0.2"
