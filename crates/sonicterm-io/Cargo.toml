[package]
name = "sonicterm-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — PTY + process probes"

[lints]
workspace = true

[dependencies]
sonicterm-types.workspace = true
portable-pty.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security"] }

[target.'cfg(unix)'.dependencies]
# Needed by `PtyHandle::Drop` to send an explicit SIGKILL to the child
# shell pid before invoking portable-pty's `Child::kill`.
libc = "0.2"
