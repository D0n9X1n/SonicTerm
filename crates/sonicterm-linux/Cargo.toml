[package]
name = "sonicterm-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — Linux app"

[lints]
workspace = true

[dependencies]
sonicterm-app.workspace = true
sonicterm-app-core.workspace = true
sonicterm-cfg.workspace = true
sonicterm-engine.workspace = true
sonicterm-logging.workspace = true
anyhow.workspace = true
tracing.workspace = true

# Linux needs libc for the euid probe and for killing a hung `xdg-mime` process group;
# other Unix hosts need it for the same runner's tests.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The launcher progress signal; the same zbus `ashpd` already builds, driven by `async-io`.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.13", default-features = false, features = ["async-io"] }
async-io = "2.6"

[[bin]]
name = "sonicterm"
path = "src/main.rs"

[dev-dependencies]
roxmltree = "0.21"
tempfile = "3"
