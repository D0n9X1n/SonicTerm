[package]
name = "sonicterm-app"
autotests = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SonicTerm Terminal — app loop, windowing glue, OS drag, menubar bridge"

[lints]
workspace = true

[features]
default = []
ssh = ["sonicterm-io/ssh"]

[dependencies]
sonicterm-app-core.workspace = true
sonicterm-types.workspace = true
bytes = "1"
smallvec = "1"
sonicterm-logging.workspace = true
sonicterm-cfg.workspace = true
sonicterm-grid.workspace = true
sonicterm-vt.workspace = true
sonicterm-io.workspace = true
sonicterm-text.workspace = true
sonicterm-gpu.workspace = true
sonicterm-ui.workspace = true
sonicterm-render-model.workspace = true
winit.workspace = true
raw-window-handle.workspace = true
wgpu.workspace = true
swash.workspace = true
fontdb.workspace = true
bytemuck.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pollster.workspace = true
arboard.workspace = true
regex = { workspace = true }
notify.workspace = true
serde.workspace = true
serde_json = "1"
ureq = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# Integration tests (autotests disabled; unit tests live in tests/*_tests.rs
# and are #[path]-included from src for private access).

[[test]]
name = "alt_v_passthrough"
path = "tests/alt_v_passthrough.rs"

[[test]]
name = "child_broadcast"
path = "tests/child_broadcast.rs"

[[test]]
name = "child_main_parity_regressions"
path = "tests/child_main_parity_regressions.rs"

[[test]]
name = "child_redraw_coalescing"
path = "tests/child_redraw_coalescing.rs"

[[test]]
name = "child_scrollbar_parity"
path = "tests/child_scrollbar_parity.rs"

[[test]]
name = "child_split_pane_resize"
path = "tests/child_split_pane_resize.rs"

[[test]]
name = "command_palette_window_parity"
path = "tests/command_palette_window_parity.rs"

[[test]]
name = "inactive_tab_resize"
path = "tests/inactive_tab_resize.rs"

[[test]]
name = "menu"
path = "tests/menu.rs"

[[test]]
name = "pane_pty_close_resize"
path = "tests/pane_pty_close_resize.rs"

[[test]]
name = "read_only_window_scope"
path = "tests/read_only_window_scope.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "window_lifecycle"
path = "tests/window_lifecycle.rs"

[[test]]
name = "file_path_paste"
path = "tests/file_path_paste/main.rs"

[[test]]
name = "update_check"
path = "tests/update_check/main.rs"

[[test]]
name = "update_notification"
path = "tests/update_notification/main.rs"
