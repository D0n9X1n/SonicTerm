[package]
name = "sonicterm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — app loop, windowing glue, OS drag, menubar bridge"

[lints]
workspace = true

[dependencies]
# The governor's owner registry. This is the edge that takes
# `sonicterm-resource` from zero dependents to one: without it the crate is
# fully built and unreachable from the shipping binary.
sonicterm-resource.workspace = true
enum-map = { workspace = true }
sonicterm-app-core.workspace = true
sonicterm-types.workspace = true
bytes = "1"
smallvec = "1"
sonicterm-logging.workspace = true
sonicterm-cfg.workspace = true
sonicterm-grid.workspace = true
sonicterm-vt.workspace = true
sonicterm-io.workspace = true
sonicterm-text.workspace = true
sonicterm-gpu.workspace = true
sonicterm-ui.workspace = true
sonicterm-render-model.workspace = true
winit.workspace = true
raw-window-handle.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
arboard.workspace = true
serde.workspace = true
serde_json = "1"
ureq = "3"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gethostname = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["open_uri", "async-io"] }
async-io = "2.6"
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
# The per-window display link: NSView.displayLink (macOS 14+) and its tick target.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CABase", "CADisplayLink", "CAFrameRateRange", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4"
windows = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# For the software-adapter detection test, which enumerates the host's real
# adapters. A dev-dependency rather than a dependency: the app reaches wgpu
# through `sonicterm-gpu` and must not gain a direct one.
wgpu.workspace = true
# Drives that test's asynchronous adapter enumeration to completion.
pollster.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The close baseline identifies only its own console hosts and shell descendants from a native snapshot.
windows = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }

[features]
# Marks that this tree's App has the frame-counter API; only the perf_scenarios example reads
# it, so the same harness source also builds against a tree without the API.
perf-counters = []
# Marks that this tree's renderer reports its frame texture's extent; only the perf_scenarios
# example reads it, so the same harness source also builds against a tree without it.
perf-frame-texture = []
# Marks that this tree's App can take a memory sample tagged with a perf checkpoint; only the
# perf_scenarios example calls it, so the same harness source also builds against a tree without it.
perf-hook-checkpoint-memory = []

# AppKit objects exist only on the main thread, so the native display-link test owns its main.
[[test]]
name = "display_link_native"
path = "tests/display_link_native.rs"
harness = false

# macOS window probes run on the main thread only when explicitly requested.
[[example]]
name = "native_split_selection"
path = "examples/native_split_selection.rs"
harness = false
test = false

[[example]]
name = "perf_scenarios"
path = "examples/perf_scenarios/main.rs"
test = true

[[example]]
name = "perf_scenarios_alloc"
path = "examples/perf_scenarios/alloc_main.rs"
test = false
