[package]
name = "sonicterm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — app loop, windowing glue, OS drag, menubar bridge"

[lints]
workspace = true

[features]
default = []
ssh = ["sonicterm-io/ssh"]

[dependencies]
# The governor's owner registry. This is the edge that takes
# `sonicterm-resource` from zero dependents to one: without it the crate is
# fully built and unreachable from the shipping binary.
sonicterm-resource.workspace = true
enum-map = { workspace = true }
sonicterm-app-core.workspace = true
sonicterm-types.workspace = true
bytes = "1"
smallvec = "1"
sonicterm-logging.workspace = true
sonicterm-cfg.workspace = true
sonicterm-grid.workspace = true
sonicterm-vt.workspace = true
sonicterm-io.workspace = true
sonicterm-text.workspace = true
sonicterm-gpu.workspace = true
sonicterm-ui.workspace = true
sonicterm-render-model.workspace = true
winit.workspace = true
raw-window-handle.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pollster.workspace = true
arboard.workspace = true
regex = { workspace = true }
serde.workspace = true
serde_json = "1"
ureq = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
