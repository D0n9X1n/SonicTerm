# Modified by SonicTerm: retain only the Windows, macOS, and Linux desktop subset.

[package]
edition = "2021"
rust-version = "1.70.0"
name = "winit"
version = "0.30.13"
authors = [
    "The winit contributors",
    "Pierre Krieger <pierre.krieger1708@gmail.com>",
]
build = "build.rs"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/LICENSE",
    "/src/*.rs",
    "/src/platform/*.rs",
    "/src/platform_impl/mod.rs",
    "/src/platform_impl/windows/**",
    "/src/platform_impl/macos/**",
    "/src/platform_impl/linux/**",
    "/tests/send_objects.rs",
    "/tests/serde_objects.rs",
    "/tests/sync_object.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cross-platform window creation library."
documentation = "https://docs.rs/winit"
keywords = ["windowing"]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/rust-windowing/winit"

[features]
default = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
]
mint = ["dpi/mint"]
rwh_04 = ["dep:rwh_04"]
rwh_05 = ["dep:rwh_05"]
rwh_06 = ["dep:rwh_06"]
serde = [
    "dep:serde",
    "cursor-icon/serde",
    "smol_str/serde",
    "dpi/serde",
]
wayland = [
    "wayland-client",
    "wayland-backend",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "sctk",
    "ahash",
    "memmap2",
]
wayland-csd-adwaita = [
    "sctk-adwaita",
    "sctk-adwaita/ab_glyph",
]
wayland-csd-adwaita-crossfont = [
    "sctk-adwaita",
    "sctk-adwaita/crossfont",
]
wayland-csd-adwaita-notitle = ["sctk-adwaita"]
wayland-dlopen = ["wayland-backend/dlopen"]
x11 = [
    "x11-dl",
    "bytemuck",
    "percent-encoding",
    "xkbcommon-dl/x11",
    "x11rb",
]

[lib]
name = "winit"
path = "src/lib.rs"

[[test]]
name = "send_objects"
path = "tests/send_objects.rs"

[[test]]
name = "serde_objects"
path = "tests/serde_objects.rs"

[[test]]
name = "sync_object"
path = "tests/sync_object.rs"

[dependencies.bitflags]
version = "2"

[dependencies.cursor-icon]
version = "1.1.0"

[dependencies.dpi]
version = "0.1.1"

[dependencies.rwh_04]
version = "0.4"
optional = true
package = "raw-window-handle"

[dependencies.rwh_05]
version = "0.5.2"
features = ["std"]
optional = true
package = "raw-window-handle"

[dependencies.rwh_06]
version = "0.6"
features = ["std"]
optional = true
package = "raw-window-handle"

[dependencies.serde]
version = "1"
features = ["serde_derive"]
optional = true

[dependencies.smol_str]
version = "0.2.0"

[dependencies.tracing]
version = "0.1.40"
default-features = false

[build-dependencies.cfg_aliases]
version = "0.2.1"

[target.'cfg(target_os = "linux")'.dependencies.ahash]
version = "0.8.7"
features = ["no-rng"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.bytemuck]
version = "1.13.1"
optional = true
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.calloop]
version = "0.13.0"

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2.64"

[target.'cfg(target_os = "linux")'.dependencies.memmap2]
version = "0.9.0"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.percent-encoding]
version = "2.0"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.rustix]
version = "0.38.4"
features = [
    "std",
    "system",
    "thread",
    "process",
]
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.sctk]
version = "0.19.2"
features = ["calloop"]
optional = true
default-features = false
package = "smithay-client-toolkit"

[target.'cfg(target_os = "linux")'.dependencies.sctk-adwaita]
version = "0.10.1"
optional = true
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.wayland-backend]
version = "0.3.10"
features = ["client_system"]
optional = true
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.wayland-client]
version = "0.31.10"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.wayland-protocols]
version = "0.32.8"
features = ["staging"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.wayland-protocols-plasma]
version = "0.3.8"
features = ["client"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.x11-dl]
version = "2.19.1"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.x11rb]
version = "0.13.0"
features = [
    "allow-unsafe-code",
    "dl-libxcb",
    "randr",
    "resource_manager",
    "xinput",
    "xkb",
]
optional = true
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.xkbcommon-dl]
version = "0.4.2"

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.5.1"

[target.'cfg(target_os = "macos")'.dependencies.core-foundation]
version = "0.9.3"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.5.2"
features = ["relax-sign-encoding"]

[target.'cfg(target_os = "macos")'.dependencies.core-graphics]
version = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.2.2"
features = [
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDragging",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSOpenGLView",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSView",
    "NSWindow",
    "NSWindowScripting",
    "NSWindowTabGroup",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.2.2"
features = [
    "block2",
    "dispatch",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSEnumerator",
    "NSKeyValueObserving",
    "NSNotification",
    "NSObjCRuntime",
    "NSPathUtilities",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSValue",
]

[target.'cfg(target_os = "windows")'.dependencies.unicode-segmentation]
version = "1.7.1"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.52.0"
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]
