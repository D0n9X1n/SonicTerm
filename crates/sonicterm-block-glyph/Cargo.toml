[package]
name = "sonicterm-block-glyph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — vendored wezterm customglyph.rs (block / box-drawing / powerline / sextant geometry). MIT, attribution in LICENSE-WEZTERM."

[lints]
workspace = true

[dependencies]
# Leaf rule: this crate depends on no first-party SonicTerm crate. Callers pass
# plain pixel values, and the tile type is local (`glue::BlockRasterTile`).
#
# euclid: backs the `Point`, `Rect`, `Size`, and `PixelLength` aliases in
# `glue.rs` that the imported geometry code is written against.
euclid = "0.22"
# tiny-skia: the CPU rasterizer that fills and strokes every glyph path, which
# also lets this crate's raster tests run without a GPU.
tiny-skia.workspace = true
# bitflags: defines the `CellDiagonal`, `Triangle`, `ProgressChunk`, and
# `Branch` flag sets. bitflags 2.x requires explicit derives on each generated
# flag set; keep those derives in customglyph.rs because BlockKey stores these
# flags in hashable/debuggable cache keys.
bitflags = "2.11"
# anyhow: the error type of `block_sprite` and `block_sprite_with_cell_metrics`.
anyhow.workspace = true
# log: `Bitmap::log_bits` and the invalid-oval report in `customglyph.rs`.
log = "0.4"
