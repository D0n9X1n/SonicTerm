[package]
name = "sonicterm-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — stdio MCP bridge from an agent to a running SonicTerm's control server"

[lints]
workspace = true

[[bin]]
name = "sonicterm-mcp"
path = "src/main.rs"

[dependencies]

# Peer credentials (`getpeereid`, `SO_PEERCRED`), the effective uid and the liveness probe.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The named-pipe client: overlapped IO with deadlines, the server's token SID check, and
# process liveness for discovery records.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
