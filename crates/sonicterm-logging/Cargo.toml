[package]
name = "sonicterm-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SonicTerm Terminal — tracing init, rolling file sinks, retention, and crash dumps"

[lints]
workspace = true

[dependencies]
# Snapshot formatting reads the governor's own `ResourceSnapshot` rather than
# a parallel shape, so a field added there cannot silently go unreported here.
sonicterm-types.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
tracing-log = "0.2"
serde.workspace = true
parking_lot.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Process-memory sampling. `ProcessStatus` carries the commit/working-set
# counters, `Threading` the process and thread handles, `Memory` the
# address-space walk that produces the reserved figure those counters omit,
# and `Diagnostics_ToolHelp` the process and thread snapshots the Memory Usage
# report walks for child processes and thread names.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Real snapshots from the real ledger: a hand-built `ResourceSnapshot` would
# drift from what the governor actually produces, and the formatter's whole
# job is to render that faithfully.
sonicterm-resource = { workspace = true, features = ["test-util"] }
enum-map = { workspace = true }
log = "0.4"
